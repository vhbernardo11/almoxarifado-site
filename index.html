<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Almoxarifado</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f0f0f0;padding:20px}table{width:100%;border-collapse:collapse}th,td{padding:12px;text-align:left;border:1px solid #ddd}th{background:#2563eb;color:white}</style></head><body><h1>Sistema de Almoxarifado</h1><button onclick="loadProducts()">Carregar Produtos</button><table id="table"><thead><tr><th>Código</th><th>Produto</th><th>Min</th><th>Atual</th><th>Setor</th></tr></thead><tbody id="tbody"></tbody></table><script>const data={produtos:[{codigo:"130002",nome:"ACAR CRISTAL",estoqueMin:50,estoqueAtual:318,setor:"MERENDA"},{codigo:"110002",nome:"AGUA SANITARIA",estoqueMin:40,estoqueAtual:690,setor:"LIMPEZA"},{codigo:"100018",nome:"CANETA AZUL",estoqueMin:100,estoqueAtual:118,setor:"ADMIN"}]};function loadProducts(){const tbody=document.getElementById('tbody');data.produtos.forEach(p=>{tbody.innerHTML+=`<tr><td>${p.codigo}</td><td>${p.nome}</td><td>${p.estoqueMin}</td><td>${p.estoqueAtual}</td><td>${p.setor}</td></tr>`});}</script></body></html>
