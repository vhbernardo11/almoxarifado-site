name: Publicar cardápio do Armazém

on:
  push:
    branches: [main]
    paths:
      - "cardapio-armazem/**"
      - ".github/workflows/publicar-cardapio.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Preparar cardápio
        uses: actions/upload-pages-artifact@v4
        with:
          path: cardapio-armazem
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
