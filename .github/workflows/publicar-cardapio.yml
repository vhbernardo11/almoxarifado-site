name: Publicar cardápio do Armazém

on:
  push:
    branches: [main]
    paths:
      - "cardapio-armazem/**"
      - ".github/workflows/publicar-cardapio.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Ativar GitHub Pages automaticamente
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.request('POST /repos/{owner}/{repo}/pages', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                build_type: 'workflow',
                headers: {
                  'X-GitHub-Api-Version': '2022-11-28'
                }
              })
              core.info('GitHub Pages ativado com sucesso.')
            } catch (error) {
              if (error.status === 409 || error.status === 422) {
                core.info('GitHub Pages já estava ativado ou configurado.')
              } else {
                throw error
              }
            }

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar cardápio
        uses: actions/upload-pages-artifact@v4
        with:
          path: cardapio-armazem

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Registrar resultado da publicação
        uses: actions/github-script@v7
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = '.deployment/cardapio-status.json'
            const payload = {
              status: 'publicado',
              url: process.env.PAGE_URL,
              commit: context.sha,
              atualizado_em: new Date().toISOString()
            }
            let sha
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path
              })
              sha = current.data.sha
            } catch (error) {
              if (error.status !== 404) throw error
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'Registra publicação do cardápio',
              content: Buffer.from(JSON.stringify(payload, null, 2)).toString('base64'),
              sha
            })
