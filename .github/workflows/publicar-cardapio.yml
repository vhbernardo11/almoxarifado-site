name: Publicar cardápio do Armazém

on:
  push:
    branches: [main]
    paths:
      - "cardapio-armazem/**"
      - ".github/workflows/publicar-cardapio.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        id: checkout
        uses: actions/checkout@v4

      - name: Ativar GitHub Pages automaticamente
        id: activate_pages
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.request('POST /repos/{owner}/{repo}/pages', {
                owner: context.repo.owner,
                repo: context.repo.repo,
                build_type: 'workflow',
                headers: {
                  'X-GitHub-Api-Version': '2022-11-28'
                }
              })
              core.setOutput('api_status', '201')
              core.setOutput('api_message', 'GitHub Pages ativado com sucesso.')
            } catch (error) {
              core.setOutput('api_status', String(error.status || 'desconhecido'))
              core.setOutput('api_message', error.message || String(error))
              core.warning(`Não foi possível ativar o Pages: ${error.status || ''} ${error.message || error}`)
            }

      - name: Configurar GitHub Pages
        id: configure_pages
        uses: actions/configure-pages@v5

      - name: Preparar cardápio
        id: upload_artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: cardapio-armazem

      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Registrar diagnóstico da publicação
        if: always()
        uses: actions/github-script@v7
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          ACTIVATE_RESULT: ${{ steps.activate_pages.outcome }}
          ACTIVATE_API_STATUS: ${{ steps.activate_pages.outputs.api_status }}
          ACTIVATE_API_MESSAGE: ${{ steps.activate_pages.outputs.api_message }}
          CONFIGURE_RESULT: ${{ steps.configure_pages.outcome }}
          UPLOAD_RESULT: ${{ steps.upload_artifact.outcome }}
          DEPLOY_RESULT: ${{ steps.deployment.outcome }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const path = '.deployment/cardapio-status.json'
            const publicado = process.env.DEPLOY_RESULT === 'success'
            const payload = {
              status: publicado ? 'publicado' : 'falhou',
              url: process.env.PAGE_URL || 'https://vhbernardo11.github.io/almoxarifado-site/',
              etapas: {
                ativacao_pages: process.env.ACTIVATE_RESULT,
                ativacao_api_status: process.env.ACTIVATE_API_STATUS,
                ativacao_api_mensagem: process.env.ACTIVATE_API_MESSAGE,
                configuracao_pages: process.env.CONFIGURE_RESULT,
                envio_arquivos: process.env.UPLOAD_RESULT,
                publicacao: process.env.DEPLOY_RESULT
              },
              commit: context.sha,
              atualizado_em: new Date().toISOString()
            }
            let sha
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path
              })
              sha = current.data.sha
            } catch (error) {
              if (error.status !== 404) throw error
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'Registra diagnóstico da publicação do cardápio',
              content: Buffer.from(JSON.stringify(payload, null, 2)).toString('base64'),
              sha
            })
