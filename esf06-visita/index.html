<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="referrer" content="no-referrer">
<title>ESF06 • Visita com assinatura</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#172033;background:#f3f6f8}*{box-sizing:border-box}body{margin:0;background:#f3f6f8}.top{position:sticky;top:0;z-index:20;background:#0f766e;color:#fff;padding:14px 16px;box-shadow:0 2px 12px #0002}.top h1{font-size:18px;margin:0}.top small{opacity:.85}.wrap{max-width:860px;margin:auto;padding:16px 16px 98px}.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #10203010}.hero{background:linear-gradient(135deg,#0f766e,#0b5e58);color:#fff}.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:620px){.g2{grid-template-columns:1fr}}label{display:block;font-size:13px;font-weight:700;margin:8px 0 5px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid #cbd5e1;border-radius:11px;padding:12px;background:#fff;color:#172033}textarea{min-height:100px;resize:vertical}button{border:0;border-radius:11px;padding:12px 14px;font-weight:800;cursor:pointer}.primary{background:#0f766e;color:#fff}.secondary{background:#e6f3f1;color:#0b5e58}.ghost{background:#eef2f6;color:#27364a}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.tabs{display:flex;gap:8px;overflow:auto;padding:10px 0}.tabs button{white-space:nowrap}.muted{color:#64748b}.small{font-size:12px}.result{border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin:8px 0;cursor:pointer}.result:active{background:#f0fdfa}.section-title{margin:4px 0 8px;font-size:16px;color:#0b5e58}.q{padding:12px 0;border-bottom:1px solid #eef2f6}.yesno{display:flex;gap:8px}.yesno button{flex:1;background:#eef2f6}.yesno button.on{background:#0f766e;color:#fff}.sig-wrap{border:2px dashed #94a3b8;border-radius:14px;overflow:hidden;background:#fff}.sig-wrap canvas{width:100%;height:220px;display:block;touch-action:none}.status{padding:10px 12px;border-radius:10px;margin:10px 0}.ok{background:#dcfce7;color:#166534}.err{background:#fee2e2;color:#991b1b}.warn{background:#fef3c7;color:#92400e}.history{border-left:4px solid #0f766e;padding:10px 12px;background:#f8fafc;border-radius:8px;margin:8px 0}.qedit{border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin:9px 0}.footerbar{position:fixed;bottom:0;left:0;right:0;background:#ffffffee;backdrop-filter:blur(8px);border-top:1px solid #e2e8f0;padding:10px;z-index:15}.footerbar .inner{max-width:860px;margin:auto;display:flex;gap:8px}.footerbar button{flex:1}.req{color:#dc2626}.empty{text-align:center;color:#64748b;padding:24px}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#e6f3f1;color:#0b5e58;margin:2px}.who{line-height:1.5}.loading{opacity:.7;pointer-events:none}
</style>
</head>
<body>
<div class="top"><h1>ESF06 • Visita com assinatura</h1><small>Acesso direto • sem login</small></div>
<div class="wrap" id="app"><div class="card">Carregando…</div></div>
<script>
(()=>{
'use strict';
const API='https://pvwqxpqetdxtmqqypqjk.supabase.co/functions/v1/acs-visita-api';
const app=document.getElementById('app');
let key=new URL(location.href).searchParams.get('k')||localStorage.getItem('esf06_visit_key')||'';
if(key){localStorage.setItem('esf06_visit_key',key);if(location.search.includes('k='))history.replaceState({},'',location.pathname)}
const S={profile:null,tab:'buscar',person:null,questions:[],answers:{},form:null,ink:false,canvas:null,ctx:null};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const now=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const fmt=v=>{if(!v)return'';const p=String(v).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:v};
async function api(name,opts={}){const u=new URL(API);u.searchParams.set('api',name);u.searchParams.set('k',key);Object.entries(opts.params||{}).forEach(([a,b])=>u.searchParams.set(a,String(b)));const r=await fetch(u,{method:opts.method||'GET',headers:opts.body?{'content-type':'application/json'}:undefined,body:opts.body?JSON.stringify(opts.body):undefined,cache:'no-store'});const j=await r.json().catch(()=>({error:'Falha de comunicação'}));if(!r.ok)throw new Error(j.error||'Erro');return j}
function toast(m,t='ok'){const d=document.createElement('div');d.className='status '+t;d.textContent=m;app.prepend(d);setTimeout(()=>d.remove(),4200)}
async function init(){if(!key){app.innerHTML='<div class="card"><h2>Link pessoal necessário</h2><p class="muted">Abra esta página pelo seu link pessoal uma vez. Depois ela entra direto neste aparelho.</p></div>';return}try{S.profile=(await api('profile')).profile;renderShell()}catch(e){app.innerHTML='<div class="status err">Link pessoal inválido ou desativado.</div>'}}
function renderShell(){app.innerHTML='<div class="card hero"><div class="who"><b>'+esc(S.profile.full_name)+'</b><br><span class="small">Microárea '+esc(S.profile.microarea)+' • acesso direto</span></div></div><div class="tabs"><button class="secondary" data-tab="buscar">Nova visita</button><button class="secondary" data-tab="historico">Formulários</button><button class="secondary" data-tab="perguntas">Editar perguntas</button></div><div id="view"></div>';document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;renderTab()});renderTab()}
function renderTab(){const v=document.getElementById('view');if(S.tab==='historico')return historyList(v);if(S.tab==='perguntas')return questionsAdmin(v);searchView(v)}
function searchView(v){S.person=null;S.form=null;S.answers={};v.innerHTML='<div class="card"><h2>Nova visita</h2><p class="muted">Pesquise o paciente pelo nome.</p><input id="search" placeholder="Digite pelo menos 2 letras" autocomplete="off"><div id="results"></div></div>';let t;document.getElementById('search').oninput=e=>{clearTimeout(t);const q=e.target.value.trim();if(q.length<2){document.getElementById('results').innerHTML='';return}t=setTimeout(()=>search(q),220)}}
async function search(q){const box=document.getElementById('results');box.innerHTML='<div class="empty">Buscando…</div>';try{const rows=(await api('search',{params:{q}})).rows;box.innerHTML=rows.length?rows.map((p,i)=>'<div class="result" data-i="'+i+'"><b>'+esc(p.full_name)+'</b><div class="small muted">Família '+esc(p.family_code||'')+' • '+esc(p.street||'')+', '+esc(p.number||'')+'</div></div>').join(''):'<div class="empty">Nenhum paciente encontrado.</div>';box.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>startVisit(rows[+el.dataset.i]))}catch(e){box.innerHTML='<div class="status err">'+esc(e.message)+'</div>'}}
async function startVisit(p){S.person=p;S.form={id:crypto.randomUUID(),visit_date:today(),visit_time:now(),status:'draft'};S.questions=(await api('questions')).rows;S.answers=prefill(p);visitForm()}
function prefill(p){const a={};['phone','relationship','occupation','education'].forEach(k=>{if(p[k])a[k]=p[k]});if(p.individual_registration)a.individual_registration='Sim';const f=p.flags||{},m={gestante:'gestante',hipertenso:'hipertenso',diabetico:'diabetico',acamado:'acamado',domiciliado:'domiciliado',oncologia:'oncologia',pcd:'pcd',saude_mental:'saudeMental',crianca_ate_2:'criancaAte2',idoso:'idoso'};Object.entries(m).forEach(([k,x])=>{if(f[x]===true)a[k]='Sim'});return a}
function control(q){const val=S.answers[q.slug]??'',h='<label>'+esc(q.label)+(q.required?'<span class="req"> *</span>':'')+'</label>'+(q.help_text?'<div class="small muted">'+esc(q.help_text)+'</div>':'');if(q.answer_type==='textarea')return h+'<textarea data-a="'+q.slug+'">'+esc(val)+'</textarea>';if(q.answer_type==='yes_no')return h+'<div class="yesno">'+['Sim','Não','Não informado'].map(x=>'<button type="button" data-yn="'+q.slug+'" data-v="'+x+'" class="'+(val===x?'on':'')+'">'+(x==='Não informado'?'N/I':x)+'</button>').join('')+'</div>';if(q.answer_type==='select'){const o=Array.isArray(q.options)?q.options:[];return h+'<select data-a="'+q.slug+'"><option value="">Selecionar</option>'+o.map(x=>'<option '+(String(val)===String(x)?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select>'}return h+'<input data-a="'+q.slug+'" type="'+(q.answer_type==='date'?'date':q.answer_type==='number'?'number':'text')+'" value="'+esc(val)+'">'}
function visitForm(){const sec={};S.questions.forEach(q=>(sec[q.section]=sec[q.section]||[]).push(q));let h='<div class="card hero"><h2>'+esc(S.person.full_name)+'</h2><div>Família '+esc(S.person.family_code||'')+'</div><div class="small">'+esc(S.person.street||'')+', '+esc(S.person.number||'')+' • '+esc(S.person.neighborhood||'')+'</div></div><div class="card"><div class="grid g2"><div><label>Data</label><input id="date" type="date" value="'+esc(S.form.visit_date||today())+'"></div><div><label>Hora</label><input id="time" type="time" value="'+esc(S.form.visit_time||now())+'"></div></div></div>';Object.keys(sec).forEach(s=>h+='<div class="card"><h3 class="section-title">'+esc(s)+'</h3>'+sec[s].map(q=>'<div class="q">'+control(q)+'</div>').join('')+'</div>');h+='<div class="card"><h3>Assinatura do paciente / responsável</h3><label>Nome de quem assina</label><input id="signer" value="'+esc(S.form.signer_name||'')+'" placeholder="Nome completo"><p class="small muted">Assine com o dedo dentro do quadro.</p><div class="sig-wrap"><canvas id="sig"></canvas></div><button class="ghost" id="clear" style="margin-top:8px">Limpar assinatura</button></div><div class="footerbar"><div class="inner"><button class="ghost" id="cancel">Cancelar</button><button class="secondary" id="draft">Salvar rascunho</button><button class="primary" id="finish">Finalizar</button></div></div>';document.getElementById('view').innerHTML=h;document.querySelectorAll('[data-a]').forEach(e=>e.oninput=e.onchange=()=>S.answers[e.dataset.a]=e.value);document.querySelectorAll('[data-yn]').forEach(b=>b.onclick=()=>{S.answers[b.dataset.yn]=b.dataset.v;document.querySelectorAll('[data-yn="'+b.dataset.yn+'"]').forEach(x=>x.classList.toggle('on',x===b))});document.getElementById('date').onchange=e=>S.form.visit_date=e.target.value;document.getElementById('time').onchange=e=>S.form.visit_time=e.target.value;document.getElementById('cancel').onclick=()=>{S.tab='buscar';renderTab()};document.getElementById('draft').onclick=()=>save(false);document.getElementById('finish').onclick=()=>save(true);document.getElementById('clear').onclick=clearSig;setTimeout(initSig,30)}
function initSig(){const c=document.getElementById('sig');if(!c)return;S.canvas=c;const dpr=Math.max(1,devicePixelRatio||1),r=c.getBoundingClientRect();c.width=Math.round(r.width*dpr);c.height=Math.round(220*dpr);const x=c.getContext('2d');S.ctx=x;x.scale(dpr,dpr);x.lineWidth=2.2;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#111827';S.ink=false;let down=false,last;const pt=e=>{const rr=c.getBoundingClientRect();return{x:e.clientX-rr.left,y:e.clientY-rr.top}};c.onpointerdown=e=>{down=true;last=pt(e);c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{if(!down)return;const p=pt(e);x.beginPath();x.moveTo(last.x,last.y);x.lineTo(p.x,p.y);x.stroke();last=p;S.ink=true};c.onpointerup=c.onpointercancel=()=>{down=false;last=null}}
function clearSig(){if(S.ctx){S.ctx.clearRect(0,0,S.canvas.width,S.canvas.height);S.ink=false}}
function snap(){return S.questions.map(q=>({id:q.id,slug:q.slug,label:q.label,section:q.section,answer_type:q.answer_type,options:q.options,required:q.required}))}
async function save(finalize){const miss=S.questions.filter(q=>q.required&&!String(S.answers[q.slug]||'').trim());if(finalize&&miss.length)return toast('Falta responder: '+miss.map(q=>q.label).join(', '),'err');const result=S.answers.visit_result||'',need=finalize&&(result==='Encontrado'||result==='Atualizar cadastro'),signer=document.getElementById('signer').value.trim();if(need&&!S.ink&&!S.form.signature_data)return toast('Colete a assinatura.','err');if(need&&!signer)return toast('Informe o nome de quem assinou.','err');const sig=S.ink?S.canvas.toDataURL('image/png'):S.form.signature_data||null;try{document.body.classList.add('loading');const out=await api('save_form',{method:'POST',body:{id:S.form.id,person_id:S.person.id,family_id:S.person.family_id,patient_name:S.person.full_name,family_code:S.person.family_code,visit_date:S.form.visit_date||today(),visit_time:S.form.visit_time||null,visit_result:result||null,status:finalize?'completed':'draft',answers:S.answers,questionnaire_snapshot:snap(),signer_name:signer||null,signature_data:sig,signed_at:sig?new Date().toISOString():null,notes:S.answers.visit_notes||null,finalize}});S.form=out.form;toast(finalize?'Visita finalizada e salva.':'Rascunho salvo.');if(finalize){S.tab='historico';renderTab()}}catch(e){toast(e.message,'err')}finally{document.body.classList.remove('loading')}}
async function historyList(v){v.innerHTML='<div class="card"><h2>Formulários</h2><div class="empty">Carregando…</div></div>';try{const rows=(await api('history')).rows;v.innerHTML='<div class="card"><h2>Formulários</h2><p class="muted">Rascunhos podem ser retomados.</p>'+(rows.length?rows.map((x,i)=>'<div class="history"><b>'+esc(x.patient_name)+'</b><div class="small">'+fmt(x.visit_date)+' • '+esc(x.visit_result||'Sem resultado')+' • '+(x.status==='completed'?'Concluído':'Rascunho')+'</div><button class="secondary" data-h="'+i+'" style="margin-top:8px">'+(x.status==='draft'?'Retomar':'Ver')+'</button></div>').join(''):'<div class="empty">Nenhum formulário salvo.</div>')+'</div>';v.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>openForm(rows[+b.dataset.h].id))}catch(e){v.innerHTML='<div class="status err">'+esc(e.message)+'</div>'}}
async function openForm(id){try{const f=(await api('form',{params:{id}})).form;if(!f)throw new Error('Formulário não encontrado');if(f.status==='completed'){const a=f.answers||{},s=f.questionnaire_snapshot||[];document.getElementById('view').innerHTML='<div class="card hero"><h2>'+esc(f.patient_name)+'</h2><div>'+fmt(f.visit_date)+' • '+esc(f.visit_result||'')+'</div></div><div class="card"><h3>Respostas</h3>'+s.map(q=>'<div class="q"><b>'+esc(q.label)+'</b><div>'+esc(a[q.slug]||'—')+'</div></div>').join('')+'</div><div class="card"><h3>Assinatura</h3><p>'+esc(f.signer_name||'Sem assinatura')+'</p>'+(f.signature_data?'<img alt="Assinatura" src="'+f.signature_data+'" style="max-width:100%;border:1px solid #ddd;border-radius:10px">':'')+'</div><button class="ghost" id="back">Voltar</button>';document.getElementById('back').onclick=()=>historyList(document.getElementById('view'));return}const p=(await api('person',{params:{id:f.person_id}})).person;S.person=p;S.form=f;S.answers=f.answers||{};S.questions=(await api('questions')).rows;visitForm()}catch(e){toast(e.message,'err')}}
async function questionsAdmin(v){v.innerHTML='<div class="card"><h2>Editar perguntas</h2><p class="muted">As mudanças valem para as próximas visitas; formulários concluídos guardam as perguntas usadas.</p><button class="primary" id="newq">+ Nova pergunta</button><div id="ql"></div></div>';document.getElementById('newq').onclick=()=>editQ(null);try{const rows=(await api('questions',{params:{all:1}})).rows;const box=document.getElementById('ql');box.innerHTML=rows.map((q,i)=>'<div class="qedit"><span class="pill">'+esc(q.section)+'</span><span class="pill">ordem '+q.sort_order+'</span><br><b>'+esc(q.label)+'</b><div class="small muted">'+esc(q.answer_type)+(q.required?' • obrigatória':'')+(q.active?'':' • inativa')+'</div><button class="secondary" data-q="'+i+'" style="margin-top:8px">Editar</button></div>').join('');box.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>editQ(rows[+b.dataset.q]))}catch(e){toast(e.message,'err')}}
function editQ(q){q=q||{slug:'',section:'Geral',sort_order:100,label:'',help_text:'',answer_type:'text',options:[],required:false,active:true};const d=document.createElement('div');d.className='card';d.innerHTML='<h3>'+(q.id?'Editar pergunta':'Nova pergunta')+'</h3><label>Identificador</label><input id="qs" value="'+esc(q.slug)+'" '+(q.id?'disabled':'')+' placeholder="ex.: usa_medicacao"><div class="grid g2"><div><label>Seção</label><input id="qsec" value="'+esc(q.section)+'"></div><div><label>Ordem</label><input id="qord" type="number" value="'+q.sort_order+'"></div></div><label>Pergunta</label><input id="qlab" value="'+esc(q.label)+'"><label>Tipo</label><select id="qtyp"><option value="text">Texto</option><option value="textarea">Texto longo</option><option value="yes_no">Sim/Não</option><option value="select">Lista</option><option value="date">Data</option><option value="number">Número</option></select><label>Opções da lista, separadas por vírgula</label><input id="qopt" value="'+esc((q.options||[]).join(', '))+'"><div class="row"><label><input id="qreq" type="checkbox" style="width:auto" '+(q.required?'checked':'')+'> Obrigatória</label><label><input id="qact" type="checkbox" style="width:auto" '+(q.active?'checked':'')+'> Ativa</label></div><div class="row"><button class="ghost" id="qc">Cancelar</button><button class="primary" id="qsv">Salvar</button></div>';document.getElementById('view').prepend(d);document.getElementById('qtyp').value=q.answer_type;document.getElementById('qc').onclick=()=>d.remove();document.getElementById('qsv').onclick=async()=>{const slug=document.getElementById('qs').value.trim().toLowerCase().replace(/[^a-z0-9_]+/g,'_'),row={id:q.id||null,slug,section:document.getElementById('qsec').value.trim()||'Geral',sort_order:+document.getElementById('qord').value||100,label:document.getElementById('qlab').value.trim(),answer_type:document.getElementById('qtyp').value,options:document.getElementById('qopt').value.split(',').map(x=>x.trim()).filter(Boolean),required:document.getElementById('qreq').checked,active:document.getElementById('qact').checked};if(!row.slug||!row.label)return toast('Preencha identificador e pergunta.','err');try{await api('save_question',{method:'POST',body:row});d.remove();toast('Pergunta salva.');questionsAdmin(document.getElementById('view'))}catch(e){toast(e.message,'err')}}}
init();
})();
</script>
</body>
</html>
