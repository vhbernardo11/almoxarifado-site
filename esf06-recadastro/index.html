<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a31">
<title>Gestão ACS 360 • Recadastramento</title>
<style>
:root{--navy:#071a31;--navy2:#0d2b4e;--teal:#079b88;--blue:#246bfd;--red:#cf3f45;--green:#218a5d;--amber:#9a7100;--ink:#17243b;--muted:#708096;--line:#dfe6ed;--bg:#f5f8fb;--white:#fff;--safe:env(safe-area-inset-bottom,0px);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);padding-bottom:calc(88px + var(--safe));color:var(--ink)}button,input,textarea,select{font:inherit}.hidden{display:none!important}
header{position:sticky;top:0;z-index:50;background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:14px 16px;box-shadow:0 2px 12px #0013}.head{max-width:980px;margin:auto;display:flex;align-items:center;gap:12px}.logo{width:50px;height:50px;border-radius:16px;background:linear-gradient(145deg,#16c7b0,#079b88);display:grid;place-items:center;font-size:30px;font-weight:900}.kicker{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#72dfd2;font-weight:900}.name{font-size:20px;font-weight:900}.subhead{font-size:13px;color:#c5d1e1}
main{max-width:980px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#0c3153,#0f6a72);border-radius:22px;padding:18px;color:#fff;margin-bottom:12px}.hero h1{margin:0;font-size:25px}.hero p{margin:6px 0 0;color:#c8e0e3;line-height:1.4}.card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:14px;margin-bottom:10px}.title{font-size:18px;font-weight:900}.sub{font-size:12px;color:var(--muted);line-height:1.4}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px}.kpi b{font-size:26px;display:block}.kpi span{font-size:11px;color:var(--muted)}
.btn{border:0;border-radius:12px;padding:10px 12px;font-weight:900}.primary{background:var(--blue);color:#fff}.teal{background:var(--teal);color:#fff}.soft{background:#eaf2ff;color:#205dc2}.gray{background:#eef2f6;color:#526176}.red{background:#ffe9e9;color:#ad3136}.block{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>.btn{flex:1}
input,select,textarea{width:100%;border:1px solid #d9e1e9;border-radius:13px;padding:11px;background:#fff;color:var(--ink)}label{display:block;font-size:12px;font-weight:850;color:#526176;margin:10px 0 5px}
.search{font-size:16px;padding:13px 14px}.street{border-left:6px solid var(--teal)}.house{border-left:6px solid #c5ccd6}.house.done{border-left-color:var(--green);background:#f4fbf7}.house.pending{border-left-color:var(--red);background:#fff8f8}
.badge{font-size:11px;font-weight:900;border-radius:999px;padding:6px 8px;white-space:nowrap}.b-pending{background:#fbe0e0;color:#a52f35}.b-ok{background:#dff4e8;color:#176e4d}.b-warn{background:#fff2d0;color:#815b00}.address{font-size:13px;color:#68788e;margin-top:6px}.family{font-size:17px;font-weight:900;margin-top:2px}.code{font-size:11px;color:#7b8796;font-weight:900}.foot{border-top:1px solid #e8edf2;margin-top:9px;padding-top:9px;display:flex;justify-content:space-between;gap:8px;font-size:12px;color:#65758a}
.progress{height:8px;background:#edf1f4;border-radius:999px;margin-top:9px;overflow:hidden}.progress span{height:100%;display:block;background:var(--teal)}
.backdrop{position:fixed;inset:0;background:#071a3188;z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:10px}.modal{width:min(100%,680px);max-height:94vh;overflow:auto;background:#fff;border-radius:24px;padding:17px;position:relative}.close{position:absolute;right:12px;top:10px;width:38px;height:38px;border:0;border-radius:50%;font-size:22px}.section{font-size:16px;font-weight:900;margin:18px 0 8px;border-top:1px solid #e8edf2;padding-top:14px}.member{border:1px solid var(--line);border-radius:15px;padding:11px;margin-top:8px}.member-name{font-weight:900}.member-meta{font-size:12px;color:var(--muted);margin-top:3px}.tri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin-top:7px}.tri button{border:0;border-radius:10px;padding:9px 4px;font-size:12px;font-weight:850;background:#eef2f6;color:#526176}.tri .yes{background:#dff4e8;color:#176e4d}.tri .no{background:#e8edf2;color:#3d4c60}.tri .unk{background:#fff2d0;color:#815b00}
.status-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.status-grid .btn{min-height:48px}.notice{padding:12px;border-radius:14px;background:#eef5ff;color:#4f6787;font-size:13px;line-height:1.4}.notice.ok{background:#eaf9f2;color:#246d4f}.notice.warn{background:#fff7df;color:#7d631f}
.savebar{position:sticky;bottom:0;background:#fff;padding:12px 0 2px}.toast{position:fixed;left:14px;right:14px;bottom:18px;z-index:200;background:#0c7569;color:#fff;border-radius:13px;padding:12px 14px;font-weight:850}.toast.err{background:#b43b40}.loading{position:fixed;inset:0;z-index:300;background:#ffffffc7;display:grid;place-items:center;font-weight:900}
@media(min-width:720px){.grid{grid-template-columns:repeat(4,1fr)}.backdrop{align-items:center}}
</style>
</head>
<body>
<header><div class="head"><div class="logo">+</div><div><div class="kicker">Gestão ACS 360</div><div class="name">Recadastramento territorial</div><div class="subhead">Rua → endereço → família atual → condicionantes</div></div></div></header>
<main id="app"></main>
<div id="loading" class="loading hidden">Carregando…</div>
<div id="toasts"></div>
<script>
(function(){
'use strict';
var SUPA='https://pvwqxpqetdxtmqqypqjk.supabase.co';
var PUB='sb_publishable_WwKpO5d-LZzh3vgOF1dJOg_rMO7UHgF';
var ACCESS=new URL(location.href).searchParams.get('k')||localStorage.getItem('esf06_visit_key')||'';
if(ACCESS)localStorage.setItem('esf06_visit_key',ACCESS);
var FAST=SUPA+'/functions/v1/acs-patient-fast';
var REC=SUPA+'/rest/v1/rpc/esf06_campo_api';
var state={rows:[],families:[],overview:null,street:null,q:''};
var BOOLS=[
['acamado','Acamados'],['deficiencia','Deficiência'],['transtorno_mental_alto_risco','Transtornos mentais de alto risco'],['deficiencia_intelectual','Deficiências intelectuais'],
['saneamento_ruim','Saneamento ruim'],['desnutricao','Desnutrição'],['abuso_substancia_psicoativa','Abuso de substância psicoativa'],['adulto_sem_renda','>18 anos sem renda'],
['analfabetismo','Analfabetismo'],['menor_2_anos','Menor de 2 anos'],['maior_60_anos','Maior de 60 anos'],['hipertensao','Hipertensão'],['diabetes','Diabetes'],
['hemodialise','Hemodializado'],['gestante','Gestante'],['povos_originarios','Povos originários'],['doencas_transmissiveis','Hepatites / hanseníase / leishmaniose / tuberculose'],
['problema_respiratorio','Problema respiratório com uso de medicamento'],['lgbt','População LGBT'],['cancer','Câncer']];
var STATUS={nao_visitado:'Não visitado',mesma_familia:'Mesma família',mudou:'Mudou',outra_familia:'Outra família',imovel_vazio:'Imóvel vazio',nao_encontrado:'Não encontrado',recusou:'Recusou',voltar_depois:'Voltar depois'};
function E(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function N(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
function T(s){return String(s||'').toLowerCase().replace(/(^|\s)\S/g,function(m){return m.toUpperCase()})}
function age(p){if(!p||!p.birth_date)return null;var b=new Date(String(p.birth_date).slice(0,10)+'T12:00:00'),n=new Date(),a=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth();return m<0||(m===0&&n.getDate()<b.getDate())?a-1:a}
function busy(v){document.getElementById('loading').classList.toggle('hidden',!v)}
function toast(msg,err){var d=document.createElement('div');d.className='toast'+(err?' err':'');d.textContent=msg;document.getElementById('toasts').appendChild(d);setTimeout(function(){d.remove()},3200)}
function modal(html){var b=document.createElement('div');b.className='backdrop';b.innerHTML='<div class="modal">'+html+'</div>';document.body.appendChild(b);var close=function(){b.remove()};b.onclick=function(e){if(e.target===b)close()};var x=b.querySelector('[data-close]');if(x)x.onclick=close;return {el:b,close:close}}
async function fastList(){var u=new URL(FAST);u.searchParams.set('api','list');u.searchParams.set('k',ACCESS);u.searchParams.set('_',Date.now());var r=await fetch(u,{cache:'no-store'});var j=await r.json();if(!r.ok)throw new Error(j.error||'Falha ao carregar população');return j.rows||[]}
async function rpc(action,payload){var r=await fetch(REC,{method:'POST',headers:{apikey:PUB,'Content-Type':'application/json'},body:JSON.stringify({p_action:action,p_key:'ESF06-CAMPO',p_payload:payload||{}}),cache:'no-store'});var j=await r.json().catch(function(){return {message:'Resposta inválida do Supabase'}});if(!r.ok)throw new Error(j.message||j.error||'Falha no recadastramento');return j}
function groupFamilies(){var m=new Map();state.rows.forEach(function(p){var id=String(p.family_id);if(!m.has(id))m.set(id,{id:id,code:p.family_code,responsible:p.responsible_name,street:p.street,number:p.number,neighborhood:p.neighborhood,members:[]});m.get(id).members.push(p)});state.families=Array.from(m.values())}
function knownValues(fam,saved){saved=saved||{};var flags=fam?fam.members.map(function(x){return x.flags||{}}):[];var has=function(k){return flags.some(function(x){return x[k]===true})};var ages=fam?fam.members.map(age).filter(function(x){return x!=null}):[];var allAge=fam&&fam.members.length>0&&ages.length===fam.members.length;var out={
 acamado:has('acamado')?true:null,deficiencia:has('pcd')?true:null,transtorno_mental_alto_risco:(has('saudeMental')||has('saude_mental'))?true:null,
 menor_2_anos:ages.some(function(x){return x<2})?true:(allAge?false:null),maior_60_anos:ages.some(function(x){return x>=60})?true:(allAge?false:null),
 hipertensao:has('hipertenso')?true:null,diabetes:has('diabetico')?true:null,gestante:has('gestante')?true:null,problema_respiratorio:has('asma')?true:null,cancer:has('oncologia')?true:null};
 BOOLS.forEach(function(x){var k=x[0];if(saved[k]!==undefined&&saved[k]!==null)out[k]=saved[k]});return out}
function statusBadge(s){if(s==='mesma_familia')return '<span class="badge b-ok">Mesma família</span>';if(s==='nao_visitado')return '<span class="badge b-pending">Não visitado</span>';return '<span class="badge b-warn">'+E(STATUS[s]||s)+'</span>'}
function streetCard(s){var done=(s.total||0)-(s.nao_visitado||0),pct=s.total?Math.round(done*100/s.total):0;return '<div class="card street" data-street="'+E(s.street)+'"><div class="row"><div style="flex:1"><div class="title">'+E(T(s.street))+'</div><div class="sub">'+s.total+' endereço(s) · '+s.nao_visitado+' não visitado(s) · '+pct+'% percorrido</div></div><button class="btn teal" data-open-street="'+encodeURIComponent(s.street)+'">Abrir rua</button></div><div class="progress"><span style="width:'+pct+'%"></span></div></div>'}
function houseCard(x){var a=[x.street,x.number,x.reference,x.neighborhood].filter(Boolean).join(', '),done=x.visit_status!=='nao_visitado';return '<div class="card house '+(done?'done':'pending')+'" data-house-search="'+E([x.number,x.responsible_name,x.family_code].join(' '))+'"><div class="row"><div style="flex:1"><div class="code">Família '+E(x.family_code||'—')+'</div><div class="family">Nº '+E(x.number||'s/n')+' · '+E(T(x.responsible_name||'Responsável não informado'))+'</div><div class="address">📍 '+E(a||'Sem endereço')+'</div></div>'+statusBadge(x.visit_status)+'</div><div class="foot"><span>👥 '+E(x.member_count==null?'—':x.member_count)+' morador(es)</span><button class="btn soft" data-open-house="'+E(x.id)+'">Abrir domicílio</button></div></div>'}
async function renderHome(){busy(true);try{var j=await rpc('overview',{});state.overview=j;var s=j.summary||{},streets=j.streets||[];document.getElementById('app').innerHTML='<section class="hero"><h1>🏘️ Recadastrar</h1><p>Trabalho territorial organizado rua por rua e endereço por endereço.</p></section><div class="grid"><div class="kpi"><b>'+E(s.total||0)+'</b><span>Famílias</span></div><div class="kpi"><b>'+E(s.nao_visitado||0)+'</b><span>Não visitadas</span></div><div class="kpi"><b>'+E(s.concluidas||0)+'</b><span>Endereços resolvidos</span></div><div class="kpi"><b>'+E(s.voltar_depois||0)+'</b><span>Voltar depois</span></div></div><div class="card"><div class="notice ok"><b>51 colunas não significam 51 perguntas.</b><br>28 colunas são dados de entrada; 23 são cálculos automáticos. Família, responsável, endereço, moradores e várias condições já vêm do Gestão/Supabase.</div></div><div class="card"><input class="search" id="qstreet" placeholder="Buscar rua..."></div><div id="streetlist">'+streets.map(streetCard).join('')+'</div>';document.querySelectorAll('[data-open-street]').forEach(function(b){b.onclick=function(){openStreet(decodeURIComponent(b.dataset.openStreet))}});document.getElementById('qstreet').oninput=function(e){var q=N(e.target.value);document.querySelectorAll('[data-street]').forEach(function(el){el.classList.toggle('hidden',!N(el.dataset.street).includes(q))})}}catch(e){toast(e.message,true)}finally{busy(false)}}
async function openStreet(street){busy(true);try{var j=await rpc('street',{street:street});state.street=j;document.getElementById('app').innerHTML='<section class="hero"><h1>📍 '+E(T(street))+'</h1><p>'+j.rows.length+' família(s), em ordem de número.</p></section><div class="row"><button class="btn soft" id="back">← Ruas</button></div><div class="card" style="margin-top:10px"><input class="search" id="qhouse" placeholder="Buscar nº, responsável ou família..."></div><div id="houselist">'+j.rows.map(houseCard).join('')+'</div>';document.getElementById('back').onclick=renderHome;document.querySelectorAll('[data-open-house]').forEach(function(b){b.onclick=function(){openFamily(b.dataset.openHouse)}});document.getElementById('qhouse').oninput=function(e){var q=N(e.target.value);document.querySelectorAll('[data-house-search]').forEach(function(el){el.classList.toggle('hidden',!N(el.dataset.houseSearch).includes(q))})}}catch(e){toast(e.message,true)}finally{busy(false)}}
function tri(label,key,val){function cl(v){return v===val?(v===true?'yes':v===false?'no':'unk'):''}return '<div class="member"><div class="member-name">'+E(label)+'</div><div class="tri" data-field="'+E(key)+'"><button class="'+cl(true)+'" data-v="true">Sim</button><button class="'+cl(false)+'" data-v="false">Não</button><button class="'+cl(null)+'" data-v="null">Não confirmado</button></div></div>'}
async function openFamily(id){busy(true);try{var j=await rpc('family',{id:id}),f=j.family||{},saved=j.recadastro||{},visit=j.visit||{},fam=state.families.find(function(x){return x.id===id}),known=knownValues(fam,saved),members=fam?fam.members:[];var html='<button class="close" data-close>×</button><h2>'+E(T(f.responsible_name||'Família'))+'</h2><div class="sub">Família '+E(f.family_code||'—')+' · '+E([f.street,f.number,f.neighborhood].filter(Boolean).join(', '))+'</div><div class="section">1. Situação do domicílio</div><div class="status-grid" id="statusgrid">'+Object.keys(STATUS).filter(function(k){return k!=='nao_visitado'}).map(function(k){return '<button class="btn '+(visit.visit_status===k?'primary':'gray')+'" data-status="'+k+'">'+E(STATUS[k])+'</button>'}).join('')+'</div><div id="same" class="'+(visit.visit_status==='mesma_familia'?'':'hidden')+'"><div class="section">2. Confirmar composição familiar</div><div class="notice">'+(members.length?members.map(function(p){return E(T(p.full_name))+(p.role==='responsavel'?' · ARRIMO':'')}).join('<br>'):'Integrantes não carregados.')+'</div><div class="grid"><div><label>Data</label><input id="rdate" type="date" value="'+E(saved.data_recadastramento||new Date().toISOString().slice(0,10))+'"></div><div><label>Nº moradores</label><input id="rmor" type="number" min="0" value="'+E(saved.moradores==null?f.member_count:saved.moradores)+'"></div><div><label>Nº cômodos</label><input id="rcom" type="number" min="1" value="'+E(saved.comodos||'')+'"></div><div><label>Distância (km)</label><input id="rdist" type="number" min="0" step="0.1" value="'+E(saved.distancia_km||'')+'"></div></div><div class="section">3. Condicionantes</div><div class="notice ok">O que o Gestão já sabe aparece marcado. Confirme ou corrija; deixe “Não confirmado” apenas se ainda precisar perguntar.</div><div id="bools">'+BOOLS.map(function(x){return tri(x[1],x[0],known[x[0]]==null?null:known[x[0]])}).join('')+'</div></div><div id="newfam" class="'+(visit.visit_status==='outra_familia'?'':'hidden')+'"><div class="section">Nova família encontrada</div><label>Responsável atual</label><input id="newname" value="'+E(visit.current_responsible_name||'')+'"><label>Nº moradores</label><input id="newcount" type="number" min="0" value="'+E(visit.current_member_count||'')+'"></div><div class="section">Observação</div><textarea id="notes" rows="3">'+E(visit.notes||'')+'</textarea><div class="savebar"><button class="btn teal block" id="save">Salvar e voltar para a rua</button></div>';var m=modal(html),status=visit.visit_status||'nao_visitado',vals={};BOOLS.forEach(function(x){vals[x[0]]=known[x[0]]==null?null:known[x[0]]});function setStatus(s){status=s;m.el.querySelectorAll('[data-status]').forEach(function(b){b.className='btn '+(b.dataset.status===s?'primary':'gray')});m.el.querySelector('#same').classList.toggle('hidden',s!=='mesma_familia');m.el.querySelector('#newfam').classList.toggle('hidden',s!=='outra_familia')}m.el.querySelectorAll('[data-status]').forEach(function(b){b.onclick=function(){setStatus(b.dataset.status)}});m.el.querySelectorAll('[data-field]').forEach(function(g){g.querySelectorAll('button').forEach(function(b){b.onclick=function(){var v=b.dataset.v==='true'?true:b.dataset.v==='false'?false:null;vals[g.dataset.field]=v;g.querySelectorAll('button').forEach(function(x){x.className=''});b.className=v===true?'yes':v===false?'no':'unk'}})});m.el.querySelector('#save').onclick=async function(){try{busy(true);var rec={};BOOLS.forEach(function(x){rec[x[0]]=vals[x[0]]});rec.data_recadastramento=m.el.querySelector('#rdate')?m.el.querySelector('#rdate').value:null;rec.moradores=m.el.querySelector('#rmor')&&m.el.querySelector('#rmor').value!==''?Number(m.el.querySelector('#rmor').value):null;rec.comodos=m.el.querySelector('#rcom')&&m.el.querySelector('#rcom').value!==''?Number(m.el.querySelector('#rcom').value):null;rec.distancia_km=m.el.querySelector('#rdist')&&m.el.querySelector('#rdist').value!==''?Number(m.el.querySelector('#rdist').value):null;var body={family_id:id,status:status,notes:m.el.querySelector('#notes').value,current_responsible_name:status==='outra_familia'?(m.el.querySelector('#newname').value):f.responsible_name,current_member_count:status==='outra_familia'?(m.el.querySelector('#newcount').value===''?null:Number(m.el.querySelector('#newcount').value)):rec.moradores,recadastro:rec,new_family:status==='outra_familia'?{responsible_name:m.el.querySelector('#newname').value,member_count:m.el.querySelector('#newcount').value===''?null:Number(m.el.querySelector('#newcount').value)}:null};await rpc('save',body);m.close();toast('Recadastramento salvo.');await openStreet(state.street.street)}catch(e){toast(e.message,true)}finally{busy(false)}}}catch(e){toast(e.message,true)}finally{busy(false)}}
async function init(){if(!ACCESS){document.getElementById('app').innerHTML='<div class="card"><div class="notice warn">Abra este módulo a partir do Gestão ACS 360 para manter seu acesso.</div></div>';return}try{busy(true);state.rows=await fastList();groupFamilies();await renderHome()}catch(e){toast(e.message,true)}finally{busy(false)}}
init();
})();
</script>
</body></html>
