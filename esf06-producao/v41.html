<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#071a31">
<title>Gestão ACS 360 • V41</title>
<style>html,body{margin:0;min-height:100%;background:#f5f8fb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#17243b}.boot{min-height:100vh;display:grid;place-items:center;padding:24px}.box{background:#fff;border:1px solid #dfe6ed;border-radius:20px;padding:22px;max-width:420px;text-align:center;box-shadow:0 8px 28px #10233a12}.spin{width:38px;height:38px;border:4px solid #dce6ef;border-top-color:#079b88;border-radius:50%;margin:0 auto 14px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="boot"><div class="box"><div class="spin"></div><strong>Carregando Gestão ACS 360 · V41…</strong><p style="color:#708096">Ativando Régua ACS e integração e-SUS APS.</p></div></div>
<script>
(async()=>{

 const ACCESS_STORAGE_KEY='esf06_visit_key';
 const PROFILE_API='https://pvwqxpqetdxtmqqypqjk.supabase.co/functions/v1/acs-visita-api';

 function readAccessInput(raw){
   let input=String(raw||'').trim();
   if(/^https?:\/\//i.test(input)){
     const link=new URL(input);
     const allowedPath='/almoxarifado-site/esf06-producao/';
     if(link.origin!==location.origin || !link.pathname.startsWith(allowedPath)){
       throw new Error('O link informado não pertence ao Gestão ACS 360.');
     }
     input=(link.searchParams.get('k')||'').trim();
   }
   if(!input || input==='SEU_K')throw new Error('Informe a chave pessoal ou o link completo recebido da unidade.');
   return input;
 }

 async function validateAccess(key){
   const url=new URL(PROFILE_API);
   url.searchParams.set('api','profile');
   url.searchParams.set('k',key);
   const resp=await fetch(url.toString(),{cache:'no-store'});
   const result=await resp.json().catch(()=>null);
   if(!resp.ok || !result || !result.profile){
     throw new Error('A chave não foi reconhecida. Confira seu link pessoal com a unidade.');
   }
 }

 function askForPersonalAccess(message=''){
   return new Promise(resolve=>{
     const box=document.querySelector('.box');
     const boot=document.querySelector('.boot');
     if(boot){boot.style.display='grid';boot.style.minHeight='100vh'}
     box.style.textAlign='left';
     box.innerHTML=[
       '<h2 style="margin:0 0 9px;font-size:24px">🔐 Acesso pessoal ESF06</h2>',
       '<p style="line-height:1.5;color:#526176;margin:0 0 16px">Para proteger os cadastros dos pacientes, informe sua chave pessoal ou cole o link de acesso que você recebeu.</p>',
       '<form id="esf06-access-form">',
       '<label for="esf06-secret" style="display:block;font-weight:700;margin-bottom:7px">Chave ou link pessoal</label>',
       '<input id="esf06-secret" type="password" required autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Cole aqui seu acesso" style="box-sizing:border-box;width:100%;padding:14px;border:1px solid #bccbd8;border-radius:12px;font:inherit;min-height:48px">',
       '<button id="esf06-access-submit" type="submit" style="margin-top:12px;border:0;border-radius:12px;padding:13px 18px;min-height:48px;background:#079b88;color:#fff;font:inherit;font-weight:800;width:100%">Entrar no aplicativo</button>',
       '<p id="esf06-access-error" role="alert" style="color:#9b2525;line-height:1.4;min-height:20px;font-size:14px"></p>',
       '</form>',
       '<p style="color:#63758b;font-size:13px;line-height:1.5;margin:5px 0 0">Não possui sua chave? Solicite seu link pessoal à administração da ESF06. Nunca compartilhe sua chave em conversas ou capturas de tela.</p>'
     ].join('');
     const form=box.querySelector('#esf06-access-form');
     const input=box.querySelector('#esf06-secret');
     const error=box.querySelector('#esf06-access-error');
     const btn=box.querySelector('#esf06-access-submit');
     error.textContent=message;
     form.addEventListener('submit',async e=>{
       e.preventDefault();
       let key;
       try{key=readAccessInput(input.value)}
       catch(err){error.textContent=err.message;return}
       btn.disabled=true;btn.textContent='Verificando acesso…';error.textContent='';
       try{
         await validateAccess(key);
         localStorage.setItem(ACCESS_STORAGE_KEY,key);
         input.value='';
         box.style.textAlign='center';
         box.innerHTML='<div class="spin"></div><strong>Carregando Gestão ACS 360…</strong>';
         resolve();
       }catch(err){
         error.textContent=err instanceof TypeError?'Falha na conexão. Verifique a internet e tente novamente.':err.message;
         btn.disabled=false;btn.textContent='Entrar no aplicativo';
       }
     });
     input.focus();
   });
 }

 async function ensurePersonalAccess(){
   const url=new URL(location.href);
   const linkKey=(url.searchParams.get('k')||'').trim();
   if(url.searchParams.has('k')){
     url.searchParams.delete('k');
     history.replaceState(null,'',url.pathname+url.search+url.hash);
   }
   const saved=(localStorage.getItem(ACCESS_STORAGE_KEY)||'').trim();
   const key=linkKey && linkKey!=='SEU_K' ? linkKey : saved;
   if(key && key!=='SEU_K'){
     try{
       await validateAccess(key);
       localStorage.setItem(ACCESS_STORAGE_KEY,key);
       return;
     }catch(err){
       if(err instanceof TypeError){
         await askForPersonalAccess('Não foi possível verificar a conexão. Tente sua chave novamente.');
       }else{
         localStorage.removeItem(ACCESS_STORAGE_KEY);
         await askForPersonalAccess('Seu acesso salvo não foi reconhecido. Informe novamente a chave pessoal.');
       }
       return;
     }
   }
   if(saved==='SEU_K')localStorage.removeItem(ACCESS_STORAGE_KEY);
   await askForPersonalAccess();
 }

 try{
   await ensurePersonalAccess();
   const r=await fetch('./index.html?force=20260927-1025-v41',{cache:'no-store'});
   if(!r.ok)throw new Error('Falha ao carregar a aplicação');
   let h=await r.text();
   h=h.replace(
     "let ACCESS=new URL(location.href).searchParams.get('k')||localStorage.getItem('esf06_visit_key')||'';\nif(ACCESS)localStorage.setItem('esf06_visit_key',ACCESS);",
     "let ACCESS=new URL(location.href).searchParams.get('k')||localStorage.getItem('esf06_visit_key')||'';\nif(ACCESS==='SEU_K'){localStorage.removeItem('esf06_visit_key');ACCESS=''}\nif(ACCESS){localStorage.setItem('esf06_visit_key',ACCESS);const __u=new URL(location.href);if(__u.searchParams.has('k')){__u.searchParams.delete('k');history.replaceState(null,'',__u.pathname+__u.search+__u.hash)}}"
   );
   // O módulo de campo usa a chave já salva no mesmo navegador; não repassá-la pela URL do paciente.
   const legacyFieldUrl="function personalUrl(path,id){const u=new URL(path,location.href);u.searchParams.set('person',id);if(ACCESS)u.searchParams.set('k',ACCESS);return u.href}";
   const safeFieldUrl="function personalUrl(path,id){const u=new URL(path,location.href);u.searchParams.set('person',id);return u.href}";
   h=h.replace(legacyFieldUrl,safeFieldUrl);
   h=h.replaceAll("PRODUÇÃO · GEO · R7","PRODUÇÃO · GEO · V41");
   h=h.replaceAll("PRODUÇÃO · GEO','PRODUÇÃO · GEO · R7","PRODUÇÃO · GEO','PRODUÇÃO · GEO · V41");
   h=h.replaceAll('bolsa-familia-r1.js?rev=20260904-1342-r1','bolsa-familia-r1.js?rev=20260914-1415-r8');
   h=h.replaceAll('route-whatsapp-r1.js?rev=20260914-0752-r1','route-whatsapp-r1.js?rev=20260914-1415-r2');
   h=h.replaceAll('family-whatsapp-r1.js?rev=20260904-1904-r1','family-whatsapp-r1.js?rev=20260914-1415-r8');
   const escapedScriptClose='<'+String.fromCharCode(92)+'/script>';
   const hook='<script src="./bolsa-familia-r1.js?rev=20260914-1415-r8">'+escapedScriptClose;
   const hook2=hook
     +'<script src="./visit-regua-r9.js?rev=20260927-1025-v41">'+escapedScriptClose
     +'<script src="./visit-regua-schedule-r10.js?rev=20260927-1025-v41">'+escapedScriptClose
     +'<script src="./rn-visit-r1.js?rev=20260927-1025-v41">'+escapedScriptClose
     +'<script src="./esus-integration-r2.js?rev=20260927-1025-v41">'+escapedScriptClose;
   if(h.includes(hook))h=h.replace(hook,hook2);
   h=h.replace('</head>','<script>document.addEventListener("DOMContentLoaded",()=>{const v=document.querySelector(".version");if(v)v.textContent="PRODUÇÃO · GEO · V41"})<\/script></head>');
   document.open();document.write(h);document.close();
 }catch(e){document.body.innerHTML='<div class="boot"><div class="box"><strong>Não foi possível abrir a versão V41.</strong><p style="color:#708096">Tente atualizar a página.</p><button onclick="location.reload()" style="border:0;border-radius:12px;padding:12px 16px;background:#079b88;color:#fff;font-weight:800">Atualizar</button></div></div>';console.error(e)}
})();
</script>
</body>
</html>
