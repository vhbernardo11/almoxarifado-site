<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#071a31">
<meta name="referrer" content="no-referrer">
<title>Gestão ACS 360 • V41</title>
<style>html,body{margin:0;min-height:100%;background:#f5f8fb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#17243b}.boot{min-height:100vh;display:grid;place-items:center;padding:24px}.box{background:#fff;border:1px solid #dfe6ed;border-radius:20px;padding:22px;max-width:420px;text-align:center;box-shadow:0 8px 28px #10233a12}.spin{width:38px;height:38px;border:4px solid #dce6ef;border-top-color:#079b88;border-radius:50%;margin:0 auto 14px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="boot"><div class="box"><div class="spin"></div><strong>Carregando Gestão ACS 360 · V41…</strong><p style="color:#708096">Ativando Régua ACS e integração e-SUS APS.</p></div></div>
<script>
(async()=>{
 async function receivePrivateActivation(){
   const params=new URLSearchParams(location.hash.replace(/^#/,''));
   const ticket=(params.get('ativar')||'').trim();
   if(!ticket)return;
   if(!/^[a-f0-9]{64}$/i.test(ticket))throw new Error('Link de ativação inválido.');
   const response=await fetch('https://pvwqxpqetdxtmqqypqjk.supabase.co/functions/v1/acs-device-activation',{
     method:'POST',
     headers:{'content-type':'application/json'},
     body:JSON.stringify({ticket}),
     cache:'no-store',
     referrerPolicy:'no-referrer'
   });
   const data=await response.json().catch(()=>({}));
   if(!response.ok || typeof data.access_key!=='string' || data.access_key.length<24)
     throw new Error(data.error||'Não foi possível ativar o navegador. Este link pode ter sido utilizado ou expirado.');
   localStorage.setItem('esf06_visit_key',data.access_key);
   history.replaceState(null,'',location.pathname+location.search);
 }
 function showAccessPanel(message){
   document.body.innerHTML=`<div class="boot"><div class="box" style="width:100%;text-align:left">
       <strong style="font-size:20px">Acesso ao Gestão ACS 360</strong>
       <p id="access-message" style="color:#526176;line-height:1.5"></p>
       <form id="access-form">
         <label for="access-ticket" style="display:block;font-weight:650;margin:12px 0 6px">Código de ativação do dispositivo</label>
         <input id="access-ticket" type="password" inputmode="text" autocomplete="off" spellcheck="false" placeholder="Cole aqui o código de ativação" style="box-sizing:border-box;width:100%;padding:13px;border:1px solid #ccd5e0;border-radius:10px">
         <p style="font-size:12px;color:#68788b">Você também pode abrir diretamente o link privado de ativação. O código é de uso único. Não envie sua chave pessoal por mensagem.</p>
         <button type="submit" style="cursor:pointer;border:0;background:#078b79;color:white;border-radius:12px;padding:13px;width:100%;font-weight:750">Ativar neste navegador</button>
       </form>
       <p id="access-input-error" role="alert" style="color:#a5212d;font-size:13px"></p>
       <button id="access-retry" type="button" style="cursor:pointer;border:1px solid #cdd6e0;background:white;color:#17243b;border-radius:12px;padding:12px;width:100%;font-weight:700">Tentar novamente</button>
       <p style="font-size:13px;line-height:1.5;color:#526176">Use o mesmo Chrome em que ativou o programa. Se não tiver um código válido, solicite uma nova ativação. Os dados permanecem no Supabase.</p>
       <a href="./diagnostico-acesso.html" style="display:block;text-align:center;color:#078b79;font-weight:650">Verificar acesso neste navegador</a>
     </div></div>`;
   document.getElementById('access-message').textContent=message;
   document.getElementById('access-retry').onclick=()=>location.reload();
   document.getElementById('access-form').onsubmit=e=>{
     e.preventDefault();
     let code=document.getElementById('access-ticket').value.trim();
     const error=document.getElementById('access-input-error');
     if(!/^[a-f0-9]{64}$/i.test(code)){
       error.textContent='Código inválido. Use o link ou código de ativação fornecido para este aparelho.';
       return;
     }
     history.replaceState(null,'',location.pathname+location.search+'#ativar='+code.toLowerCase());
     location.reload();
   };
 }
 async function validateAccess(){
   let key='';
   try{
     const address=new URL(location.href);
     const given=address.searchParams.get('k');
     if(given!==null){
       address.searchParams.delete('k');
       history.replaceState(null,'',address.pathname+address.search+address.hash);
       if(given.trim() && given.trim()!=='SEU_K')localStorage.setItem('esf06_visit_key',given.trim());
     }
     key=(localStorage.getItem('esf06_visit_key')||'').trim();
     if(key==='SEU_K'){localStorage.removeItem('esf06_visit_key');key='';}
   }catch(_){
     showAccessPanel('O navegador não permite guardar a autorização. Abra esta página diretamente no Chrome, fora do navegador interno de outro aplicativo.');
     return false;
   }
   if(!key){
     showAccessPanel('Este navegador ainda não tem uma autorização salva. É preciso ativá-lo uma única vez por meio de um link privado.');
     return false;
   }
   const url=new URL('https://pvwqxpqetdxtmqqypqjk.supabase.co/functions/v1/acs-visita-api');
   url.searchParams.set('api','profile');url.searchParams.set('k',key);
   try{
     const response=await fetch(url,{cache:'no-store',referrerPolicy:'no-referrer'});
     if(response.ok)return true;
     if(response.status===401||response.status===403){
       localStorage.removeItem('esf06_visit_key');
       showAccessPanel('A autorização salva neste navegador foi recusada. Ative novamente com um link privado de uso único.');
       return false;
     }
     showAccessPanel('O Supabase respondeu com erro HTTP '+response.status+'. Sua autorização foi preservada. Tente novamente.');
     return false;
   }catch(_){
     showAccessPanel('Não foi possível verificar a conexão com o Supabase. Sua autorização continua salva. Verifique a internet e tente novamente.');
     return false;
   }
 }

 try{
   await receivePrivateActivation();
   if(!(await validateAccess()))return;
   const r=await fetch('./index.html?force=20260927-1025-v41',{cache:'no-store'});
   if(!r.ok)throw new Error('Falha ao carregar a aplicação');
   let h=await r.text();
   h=h.replace(
     "let ACCESS=new URL(location.href).searchParams.get('k')||localStorage.getItem('esf06_visit_key')||'';\nif(ACCESS)localStorage.setItem('esf06_visit_key',ACCESS);",
     "let ACCESS=new URL(location.href).searchParams.get('k')||localStorage.getItem('esf06_visit_key')||'';\nif(ACCESS==='SEU_K'){localStorage.removeItem('esf06_visit_key');ACCESS=''}\nif(ACCESS){localStorage.setItem('esf06_visit_key',ACCESS);const __u=new URL(location.href);if(__u.searchParams.has('k')){__u.searchParams.delete('k');history.replaceState(null,'',__u.pathname+__u.search+__u.hash)}}"
   );
   // O módulo de campo usa a chave já salva no mesmo navegador; não repassá-la pela URL do paciente.
   const legacyFieldUrl="function personalUrl(path,id){const u=new URL(path,location.href);u.searchParams.set('person',id);if(ACCESS)u.searchParams.set('k',ACCESS);return u.href}";
   const safeFieldUrl="function personalUrl(path,id){const u=new URL(path,location.href);u.searchParams.set('person',id);return u.href}";
   h=h.replace(legacyFieldUrl,safeFieldUrl);
   h=h.replaceAll("PRODUÇÃO · GEO · R7","PRODUÇÃO · GEO · V41");
   h=h.replaceAll("PRODUÇÃO · GEO','PRODUÇÃO · GEO · R7","PRODUÇÃO · GEO','PRODUÇÃO · GEO · V41");
   h=h.replaceAll('bolsa-familia-r1.js?rev=20260904-1342-r1','bolsa-familia-r1.js?rev=20260914-1415-r8');
   h=h.replaceAll('route-whatsapp-r1.js?rev=20260914-0752-r1','route-whatsapp-r1.js?rev=20260914-1415-r2');
   h=h.replaceAll('family-whatsapp-r1.js?rev=20260904-1904-r1','family-whatsapp-r1.js?rev=20260914-1415-r8');
   const escapedScriptClose='<'+String.fromCharCode(92)+'/script>';
   const hook='<script src="./bolsa-familia-r1.js?rev=20260914-1415-r8">'+escapedScriptClose;
   const hook2=hook
     +'<script src="./visit-regua-r9.js?rev=20260927-1025-v41">'+escapedScriptClose
     +'<script src="./visit-regua-schedule-r10.js?rev=20260927-1025-v41">'+escapedScriptClose
     +'<script src="./rn-visit-r1.js?rev=20260927-1025-v41">'+escapedScriptClose
     +'<script src="./esus-integration-r2.js?rev=20260927-1025-v41">'+escapedScriptClose;
   if(h.includes(hook))h=h.replace(hook,hook2);
   h=h.replace('</head>','<script>document.addEventListener("DOMContentLoaded",()=>{const v=document.querySelector(".version");if(v)v.textContent="PRODUÇÃO · GEO · V41"})<\/script></head>');
   document.open();document.write(h);document.close();
 }catch(e){if(location.hash.startsWith('#ativar='))history.replaceState(null,'',location.pathname+location.search);showAccessPanel(String(e&&e.message||'Não foi possível abrir a aplicação.'));console.error(e)}
})();
</script>
</body>
</html>
