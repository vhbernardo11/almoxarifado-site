<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#071a31">
<title>Gestão ACS 360 • R9</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#071a31;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
#appframe{display:block;width:100%;height:100%;border:0;background:#f5f8fb}
#boot{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:#f5f8fb;color:#17243b}
.box{background:#fff;border:1px solid #dfe6ed;border-radius:20px;padding:22px;max-width:430px;text-align:center;box-shadow:0 8px 28px #10233a12}
.spin{width:38px;height:38px;border:4px solid #dce6ef;border-top-color:#079b88;border-radius:50%;margin:0 auto 14px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
#keybox{display:none}.keyinput{width:100%;box-sizing:border-box;border:1px solid #cbd5df;border-radius:12px;padding:12px;font-size:16px;margin:12px 0}.btn{border:0;border-radius:12px;padding:12px 16px;background:#079b88;color:white;font-weight:800;cursor:pointer}
.err{color:#9d2e36;margin-top:10px}
</style>
</head>
<body>
<div id="boot"><div class="box"><div class="spin" id="spin"></div><strong id="msg">Abrindo Gestão ACS 360 · R9…</strong><div id="keybox"><p>Digite sua chave de acesso do programa.</p><input id="key" class="keyinput" autocomplete="off" spellcheck="false" placeholder="Cole aqui sua chave k"><button class="btn" id="enter">Entrar</button><div id="err" class="err"></div></div></div></div>
<iframe id="appframe" title="Gestão ACS 360"></iframe>
<script>
(()=>{
 const qs=new URLSearchParams(location.search), boot=document.getElementById('boot'), frame=document.getElementById('appframe');
 const keybox=document.getElementById('keybox'), key=document.getElementById('key'), enter=document.getElementById('enter'), msg=document.getElementById('msg'), spin=document.getElementById('spin'), err=document.getElementById('err');
 const storageKey='esf06_access_k';
 let k=(qs.get('k')||'').trim();
 try{ if(k) localStorage.setItem(storageKey,k); else k=(localStorage.getItem(storageKey)||'').trim(); }catch(e){}
 function askKey(text){spin.style.display='none';msg.textContent=text||'Chave de acesso necessária';keybox.style.display='block';boot.style.display='grid';}
 function start(){
   if(!k){askKey();return;}
   const p=new URLSearchParams(location.search);p.set('k',k);p.set('_r9','20260915-0945');
   frame.src='./index.html?'+p.toString();
   const timer=setTimeout(()=>{msg.textContent='Ainda carregando… Se demorar, tente atualizar a página.'},12000);
   frame.onload=()=>{
     clearTimeout(timer);
     try{
       const d=frame.contentDocument;
       if(!d)throw new Error('Interface não acessível');
       const scripts=[
         ['./visit-regua-r9.js','20260915-0830-r9'],
         ['./visit-regua-schedule-r10.js','20260915-0845-r10'],
         ['./rn-visit-r1.js','20260915-0930-r1']
       ];
       scripts.forEach(([src,rev])=>{if(!d.querySelector('script[src^="'+src+'"]')){const s=d.createElement('script');s.src=src+'?rev='+rev;d.body.appendChild(s);}});
       const v=d.querySelector('.version');if(v)v.textContent='PRODUÇÃO · GEO · R9';
       boot.style.display='none';
     }catch(e){
       console.error(e);
       msg.textContent='Falha ao abrir a interface.';spin.style.display='none';
       err.textContent='Atualize a página. Se continuar, informe a mensagem que aparece dentro do programa.';
       keybox.style.display='block';
     }
   };
 }
 enter.onclick=()=>{const v=(key.value||'').trim();if(v.length<20){err.textContent='A chave parece incompleta.';return;}k=v;try{localStorage.setItem(storageKey,k)}catch(e){}const p=new URLSearchParams(location.search);p.set('k',k);history.replaceState(null,'',location.pathname+'?'+p.toString());keybox.style.display='none';spin.style.display='block';msg.textContent='Abrindo Gestão ACS 360 · R9…';err.textContent='';start();};
 key.addEventListener('keydown',e=>{if(e.key==='Enter')enter.click()});
 start();
})();
</script>
</body>
</html>
