<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#071a31">
<title>Gestão ACS 360 • R9</title>
<style>html,body{margin:0;min-height:100%;background:#f5f8fb;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#17243b}.boot{min-height:100vh;display:grid;place-items:center;padding:24px}.box{background:#fff;border:1px solid #dfe6ed;border-radius:20px;padding:22px;max-width:430px;text-align:center;box-shadow:0 8px 28px #10233a12}.spin{width:38px;height:38px;border:4px solid #dce6ef;border-top-color:#079b88;border-radius:50%;margin:0 auto 14px;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.err{color:#9d2e36;line-height:1.45}</style>
</head>
<body>
<div class="boot"><div class="box"><div class="spin"></div><strong>Carregando Gestão ACS 360 · R9…</strong><p style="color:#708096">Abrindo a versão corrigida.</p></div></div>
<script>
(async()=>{
 try{
   const r=await fetch('./index.html?force=20260915-1018-r9-fix2',{cache:'no-store'});
   if(!r.ok)throw new Error('Falha ao carregar a aplicação ('+r.status+')');
   let h=await r.text();
   h=h.replaceAll("PRODUÇÃO · GEO · R7","PRODUÇÃO · GEO · R9");
   h=h.replaceAll("PRODUÇÃO · GEO','PRODUÇÃO · GEO · R7","PRODUÇÃO · GEO','PRODUÇÃO · GEO · R9");
   h=h.replaceAll('bolsa-familia-r1.js?rev=20260904-1342-r1','bolsa-familia-r1.js?rev=20260915-0830-r9');
   h=h.replaceAll('route-whatsapp-r1.js?rev=20260914-0752-r1','route-whatsapp-r1.js?rev=20260914-1415-r2');
   h=h.replaceAll('family-whatsapp-r1.js?rev=20260904-1904-r1','family-whatsapp-r1.js?rev=20260914-1415-r8');
   const extras=[];
   if(!h.includes('visit-regua-r9.js')) extras.push('<script src="./visit-regua-r9.js?rev=20260915-0830-r9"><\\/script>');
   if(!h.includes('visit-regua-schedule-r10.js')) extras.push('<script src="./visit-regua-schedule-r10.js?rev=20260915-0845-r10"><\\/script>');
   if(!h.includes('rn-visit-r1.js')) extras.push('<script src="./rn-visit-r1.js?rev=20260915-0930-r1"><\\/script>');
   if(extras.length) h=h.replace('</body>',extras.join('')+'</body>');
   h=h.replace('</head>','<script>document.addEventListener("DOMContentLoaded",()=>{const v=document.querySelector(".version");if(v)v.textContent="PRODUÇÃO · GEO · R9"})<\/script></head>');
   document.open();document.write(h);document.close();
 }catch(e){
   console.error(e);
   document.body.innerHTML='<div class="boot"><div class="box"><strong>Não foi possível abrir o Gestão ACS 360.</strong><p class="err">'+String(e&&e.message?e.message:e)+'</p><p style="color:#708096">Tente Ctrl+F5. Se persistir, use o link principal abaixo.</p><button onclick="location.href=\'./index.html\'+location.search" style="border:0;border-radius:12px;padding:12px 16px;background:#079b88;color:#fff;font-weight:800;cursor:pointer">Abrir versão principal</button></div></div>';
 }
})();
</script>
</body>
</html>
