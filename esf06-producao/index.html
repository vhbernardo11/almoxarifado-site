<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Gestão ACS 360 • Produção Única</title>
<style>
:root{--navy:#071a31;--navy2:#0d2b4e;--teal:#079b88;--teal2:#eaf9f6;--blue:#246bfd;--red:#cf3f45;--red2:#fff0f0;--green:#218a5d;--green2:#edf9f2;--amber:#9a7100;--amber2:#fff7dd;--ink:#17243b;--muted:#708096;--line:#dfe6ed;--bg:#f5f8fb;--white:#fff;--safe:env(safe-area-inset-bottom,0px);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);min-height:100%;color:var(--ink)}body{padding-bottom:calc(82px + var(--safe));-webkit-tap-highlight-color:transparent}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
header{position:sticky;top:0;z-index:50;background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 14px;box-shadow:0 2px 12px #0013}.head{max-width:980px;margin:auto;display:flex;align-items:center;gap:12px}.logo{width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,#16c7b0,#079b88);display:grid;place-items:center;font-size:34px;font-weight:900;box-shadow:inset 0 0 0 1px #fff5}.kicker{font-size:12px;letter-spacing:2.2px;text-transform:uppercase;color:#72dfd2;font-weight:900}.name{font-size:22px;font-weight:900;line-height:1.08;margin-top:2px}.hello{font-size:14px;color:#c5d1e1;margin-top:3px}.version{margin-left:auto;border:1px solid #ffffff30;border-radius:999px;padding:9px 12px;background:#ffffff0d;color:#83e5d8;font-size:12px;font-weight:900;white-space:nowrap}
main{max-width:980px;margin:auto;padding:16px}.hero{background:linear-gradient(135deg,#0c3153,#0f6a72);border-radius:22px;padding:18px;color:#fff;margin-bottom:14px}.hero h1{margin:0;font-size:26px}.hero p{margin:6px 0 0;color:#c8e0e3;line-height:1.4}.toolbar,.chips{display:flex;gap:8px;flex-wrap:wrap}.toolbar{margin:12px 0}.chips{overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#516178;border-radius:999px;padding:9px 12px;font-size:13px;font-weight:850}.chip.on{background:#1e6df4;border-color:#1e6df4;color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 18px rgba(16,35,58,.045)}.title{font-size:19px;font-weight:900;margin-bottom:10px}.sub{color:var(--muted);font-size:13px;line-height:1.4}.search{width:100%;border:1px solid #d9e1e9;background:#fff;border-radius:15px;padding:13px 14px;outline:none;font-size:16px}.search:focus{border-color:#6fa0ff;box-shadow:0 0 0 3px #e9f1ff}.search-note{margin-top:8px;color:#64748b;font-size:12px;font-weight:750}.search-hit{margin-top:9px;padding:8px 10px;border-radius:11px;background:#eef6ff;color:#315d92;font-size:12px;font-weight:800;line-height:1.35}.grid-kpi{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:14px}.kpi{background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px}.kpi b{font-size:27px;display:block}.kpi span{font-size:12px;color:var(--muted)}.kpi.green{background:var(--green2)}.kpi.red{background:var(--red2)}.kpi.blue{background:#eef4ff}.kpi.amber{background:var(--amber2)}
.family-grid{display:grid;gap:11px}.family{border:1px solid var(--line);border-left-width:7px;border-radius:19px;background:#fff;padding:14px;cursor:pointer;transition:.15s}.family.visited{border-color:#a7d7c2;border-left-color:var(--green);background:linear-gradient(90deg,#effaf4,#fff 33%)}.family.pending{border-color:#ecc0c2;border-left-color:var(--red);background:linear-gradient(90deg,#fff2f2,#fff 33%)}.family-top{display:flex;gap:10px;align-items:flex-start}.family-main{flex:1;min-width:0}.code{font-size:11px;font-weight:900;color:#77869a}.family-name{font-size:18px;font-weight:900;line-height:1.2;margin-top:2px}.status{font-size:11px;font-weight:900;border-radius:999px;padding:6px 8px;white-space:nowrap}.status.ok{background:#dff4e8;color:#176e4d}.status.due{background:#fbe0e0;color:#a52f35}.address{font-size:13px;color:#68788e;margin-top:8px;line-height:1.35}.family-meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.tag{border-radius:999px;padding:5px 8px;font-size:11px;font-weight:850;background:#eef2f6;color:#425169}.tag.arrimo{background:#e7f0ff;color:#245da6}.tag.has{background:#fff0cf;color:#805700}.tag.dm{background:#e8efff;color:#315eaa}.tag.high{background:#ffe5e5;color:#9d3030}.tag.age{background:#efeaff;color:#6a4aaa}.tag.preg{background:#ffe8f3;color:#a33c72}.tag.child{background:#e6faf4;color:#1a7762}.tag.mental{background:#e6f4ff;color:#236c95}.family-foot{display:flex;justify-content:space-between;gap:8px;margin-top:11px;padding-top:9px;border-top:1px solid #e9edf2;color:#66768b;font-size:12px}.family-foot strong{color:#087c70}
.btn{border:0;border-radius:13px;padding:10px 13px;font-weight:900}.btn.primary{background:var(--blue);color:#fff}.btn.teal{background:var(--teal);color:#fff}.btn.soft{background:#eaf2ff;color:#205dc2}.btn.red{background:#ffe9e9;color:#ad3136}.btn.gray{background:#eef2f6;color:#526176}.btn.block{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap}.row>.btn{flex:1}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form-row input,.form-row select,.form-row textarea,input,select,textarea{width:100%;border:1px solid #d9e1e9;border-radius:13px;padding:11px;background:#fff;color:var(--ink)}label{display:block;font-size:12px;font-weight:850;color:#526176;margin:10px 0 5px}.empty{background:#f0f3f7;border-radius:17px;padding:24px;text-align:center;color:#76869a}.route{border:1px solid var(--line);border-radius:17px;padding:13px;margin-bottom:9px;background:#fff}.route.completed{background:#f3fbf7;border-color:#c8e6d7}.route-head{display:flex;gap:10px}.order{width:32px;height:32px;border-radius:10px;background:#def3ee;color:#0c7668;display:grid;place-items:center;font-weight:900;flex:0 0 auto}.route-main{flex:1}.route-name{font-weight:900}.route-reason{font-size:12px;color:#68788e;margin-top:4px}.route-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.route-actions .btn{flex:1;min-width:95px}.section{margin:18px 0 8px;font-size:17px;font-weight:900}.indicator-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.indicator{border:1px solid var(--line);border-radius:17px;background:#fff;padding:14px;text-align:left}.indicator b{font-size:24px;display:block}.indicator span{font-size:12px;color:#68788e}.report-table{width:100%;border-collapse:collapse;font-size:12px}.report-table th,.report-table td{border-bottom:1px solid #e6ebf0;padding:9px 5px;text-align:left;vertical-align:top}.report-table th{color:#64748b}.notice{padding:12px;border-radius:14px;background:#eef5ff;color:#4f6787;font-size:13px;line-height:1.4}.notice.warn{background:#fff7df;color:#7d631f}.notice.ok{background:#eaf9f2;color:#246d4f}
nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fffffffa;border-top:1px solid #e5eaf0;padding:7px 6px calc(7px + var(--safe));box-shadow:0 -8px 24px rgba(10,30,50,.06)}.nav-inner{max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:3px}.nav-btn{border:0;background:transparent;color:#6f7d90;border-radius:16px;min-height:58px;padding:4px 2px;font-size:10px;font-weight:850;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.nav-btn span:first-child{font-size:22px}.nav-btn.on{background:#eaf2ff;color:#1857ad}
.back{position:fixed;inset:0;background:#071a3188;z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{width:min(100%,650px);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;padding:18px;position:relative}.close{position:absolute;right:12px;top:10px;width:38px;height:38px;border:0;border-radius:50%;background:#f0f3f7;font-size:22px}.modal h2{margin:0 44px 3px 0;font-size:21px}.member{border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:9px}.member.visited{border-left:5px solid var(--green)}.member-name{font-weight:900}.member-meta{font-size:12px;color:#708096;margin-top:4px}.member-actions{display:flex;gap:7px;margin-top:9px}.member-actions .btn{flex:1}.toast{position:fixed;left:16px;right:16px;bottom:94px;z-index:150;background:#0c7569;color:#fff;border-radius:13px;padding:12px 14px;font-weight:850;box-shadow:0 8px 30px #0002}.toast.err{background:#b43b40}.loading{position:fixed;inset:0;z-index:200;background:#ffffffb8;display:grid;place-items:center}.spinner{width:42px;height:42px;border:4px solid #dce6ef;border-top-color:var(--teal);border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
@media(min-width:720px){.family-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.indicator-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.back{align-items:center}}@media(max-width:520px){.form-row{grid-template-columns:1fr}.version{font-size:10px;padding:8px 9px}.name{font-size:19px}.head{gap:9px}.logo{width:49px;height:49px}}
</style>
</head>
<body>
<header><div class="head"><div class="logo">+</div><div><div class="kicker">Gestão ACS 360</div><div class="name" id="profile-name">Vitor Hugo Bernardo</div><div class="hello" id="hello">Carregando dados do Supabase…</div></div><div class="version">PRODUÇÃO · ÚNICO</div></div></header>
<main id="app"></main>
<nav><div class="nav-inner" id="nav"></div></nav>
<div id="loading" class="loading hidden"><div class="spinner"></div></div>
<div id="toasts"></div>
<script>
(()=>{'use strict';
const BASE='https://pvwqxpqetdxtmqqypqjk.supabase.co/functions/v1/';
const END={main:'acs-visita-api',fast:'acs-patient-fast',plan:'acs-planner-v32',done:'acs-route-completed-v40'};
let ACCESS=new URL(location.href).searchParams.get('k')||localStorage.getItem('esf06_visit_key')||'';
if(ACCESS)localStorage.setItem('esf06_visit_key',ACCESS);
const state={page:'families',rows:[],families:[],profile:null,filter:'all',q:'',routeDate:new Date().toISOString().slice(0,10),busy:false};
const app=document.getElementById('app'),nav=document.getElementById('nav');
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const T=s=>String(s||'').toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase());
const F=d=>{if(!d)return'—';const p=String(d).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:String(d)};
const age=p=>{if(p?.age!=null&&Number.isFinite(Number(p.age)))return Number(p.age);if(!p?.birth_date)return null;const b=new Date(String(p.birth_date).slice(0,10)+'T12:00:00'),n=new Date();let a=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth();return m<0||(m===0&&n.getDate()<b.getDate())?a-1:a};
const today=()=>new Date().toISOString().slice(0,10);
function toast(msg,type='ok'){const d=document.createElement('div');d.className='toast '+(type==='err'?'err':'');d.textContent=msg;document.getElementById('toasts').appendChild(d);setTimeout(()=>d.remove(),3500)}
function busy(v=true){state.busy=v;document.getElementById('loading').classList.toggle('hidden',!v)}
async function api(which,name,{method='GET',params={},body}={}){const u=new URL(BASE+END[which]);u.searchParams.set('api',name);u.searchParams.set('k',ACCESS);u.searchParams.set('_',Date.now());Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,String(v)));const r=await fetch(u,{method,headers:body?{'content-type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined,cache:'no-store'});const j=await r.json().catch(()=>({error:'Resposta inválida do servidor'}));if(!r.ok)throw new Error(j.error||'Falha no Supabase');return j}
function modal(html){const b=document.createElement('div');b.className='back';b.innerHTML=`<div class="modal">${html}</div>`;document.body.appendChild(b);const close=()=>b.remove();b.onclick=e=>{if(e.target===b)close()};b.querySelector('[data-close]')?.addEventListener('click',close);return{el:b,close}}
function greeting(){const h=new Date().getHours();return h<12?'Bom dia!':h<18?'Boa tarde!':'Boa noite!'}
const flagLabel={hipertenso:'HAS',diabetico:'Diabetes',acamado:'Acamado',domiciliado:'Domiciliado',gestante:'Gestante',puerpera:'Puérpera',oncologia:'Oncologia',saudeMental:'Saúde mental',saude_mental:'Saúde mental',asma:'Asma',pcd:'PCD',tabagista:'Tabagismo'};
function pTags(p){const a=[],seen=new Set(),f=p.flags||{};for(const [k,v] of Object.entries(f)){if(v!==true||!flagLabel[k]||seen.has(flagLabel[k]))continue;seen.add(flagLabel[k]);let c=k==='hipertenso'?'has':k==='diabetico'?'dm':['acamado','domiciliado','oncologia'].includes(k)?'high':k==='gestante'||k==='puerpera'?'preg':k.includes('saude')?'mental':'';a.push(`<span class="tag ${c}">${E(flagLabel[k])}</span>`)}const a0=age(p);if(a0!=null&&a0>=65)a.push(`<span class="tag age">${a0>=80?'80+':'65+'} · ${a0} anos</span>`);if(a0!=null&&a0<2)a.push('<span class="tag child">&lt;2 anos</span>');return a.join('')}
function familyTags(x){const f=x.family_flags||{},a=[];if(f.hipertenso)a.push('<span class="tag has">Família c/ HAS</span>');if(f.diabetico)a.push('<span class="tag dm">Família c/ Diabetes</span>');if(f.acamado)a.push('<span class="tag high">Família c/ Acamado</span>');if(f.domiciliado)a.push('<span class="tag high">Família c/ Domiciliado</span>');if(f.gestante)a.push('<span class="tag preg">Família c/ Gestante</span>');if(f.idade_65_mais||x.members.some(p=>age(p)>=65))a.push('<span class="tag age">Família 65+</span>');if(f.menor_1_ano||f.idade_1_a_menor_2||x.members.some(p=>age(p)!=null&&age(p)<2))a.push('<span class="tag child">Criança &lt;2</span>');return a.join('')}
function groupFamilies(){const m=new Map;for(const p of state.rows){const id=String(p.family_id);if(!m.has(id))m.set(id,{id,code:p.family_code,responsible:p.responsible_name,street:p.street,number:p.number,neighborhood:p.neighborhood,family_flags:p.family_flags||{},risk:p.family_risk||'Sem risco',visited:!!p.family_visited_month,members:[]});m.get(id).members.push(p)}for(const x of m.values()){x.arrimo=x.members.find(p=>p.role==='responsavel')||x.members.find(p=>N(p.full_name)===N(x.responsible))||x.members[0];x.searchText=N([x.responsible,x.code,x.street,x.number,x.neighborhood,...x.members.map(p=>p.full_name)].filter(Boolean).join(' ')).replace(/\s+/g,' ').trim();x.memberSearch=x.members.map(p=>({name:p.full_name,n:N(p.full_name).replace(/\s+/g,' ').trim()}))}state.families=[...m.values()].sort((a,b)=>String(a.responsible||'').localeCompare(String(b.responsible||''),'pt-BR'))}
async function loadPopulation(force=false){busy();try{const j=await api('fast','list');state.rows=j.rows||[];groupFamilies()}finally{busy(false)}}
function stats(){const f=state.families,r=state.rows;return{people:r.length,families:f.length,visited:f.filter(x=>x.visited).length,pending:f.filter(x=>!x.visited).length,has:r.filter(p=>p.flags?.hipertenso).length,dm:r.filter(p=>p.flags?.diabetico).length,acam:r.filter(p=>p.flags?.acamado).length,dom:r.filter(p=>p.flags?.domiciliado).length,a65:r.filter(p=>age(p)>=65).length,preg:r.filter(p=>p.flags?.gestante).length,c2:r.filter(p=>age(p)!=null&&age(p)<2).length}}
const FILTERS={all:['Todas',x=>true],pending:['Sem visita',x=>!x.visited],visited:['Visitadas',x=>x.visited],has:['HAS',x=>x.members.some(p=>p.flags?.hipertenso)||x.family_flags?.hipertenso],dm:['Diabetes',x=>x.members.some(p=>p.flags?.diabetico)||x.family_flags?.diabetico],acam:['Acamado',x=>x.members.some(p=>p.flags?.acamado)||x.family_flags?.acamado],dom:['Domiciliado',x=>x.members.some(p=>p.flags?.domiciliado)||x.family_flags?.domiciliado],a65:['65+',x=>x.members.some(p=>age(p)>=65)],preg:['Gestante',x=>x.members.some(p=>p.flags?.gestante)],c2:['<2 anos',x=>x.members.some(p=>age(p)!=null&&age(p)<2)]};
function familyCard(x){return `<article class="family ${x.visited?'visited':'pending'}" data-family="${E(x.id)}"><div class="family-top"><div class="family-main"><div class="code">Família ${E(x.code||'—')}</div><div class="family-name">${E(T(x.responsible||x.arrimo?.full_name||'Responsável não informado'))}</div><div class="address">📍 ${E([x.street,x.number,x.neighborhood].filter(Boolean).join(', ')||'Endereço sem dado')}</div></div><span class="status ${x.visited?'ok':'due'}">${x.visited?'✓ Visitada no mês':'● Sem visita no mês'}</span></div><div class="family-meta"><span class="tag arrimo">🏠 ARRIMO</span>${familyTags(x)}</div><div class="search-hit hidden" data-search-hit></div><div class="family-foot"><span>👥 ${x.members.length} integrante(s)</span><span>${E(x.risk||'Sem risco')}</span><strong>Ver família ›</strong></div></article>`}
function queryTokens(){return N(state.q).replace(/\s+/g,' ').trim().split(' ').filter(Boolean)}
function familyMatches(x){const f=FILTERS[state.filter]?.[1]||FILTERS.all[1],tokens=queryTokens();return f(x)&&(!tokens.length||tokens.every(t=>x.searchText.includes(t)))}
function familySearchScore(x){const q=N(state.q).replace(/\s+/g,' ').trim();if(!q)return 99;const resp=N(x.responsible||''),names=x.memberSearch||[];if(resp.startsWith(q))return 0;if(names.some(p=>p.n.startsWith(q)))return 1;if(resp.includes(q))return 2;if(names.some(p=>p.n.includes(q)))return 3;return 4}
function matchingNames(x){const tokens=queryTokens();if(!tokens.length)return[];return(x.memberSearch||[]).filter(p=>tokens.every(t=>p.n.includes(t))).map(p=>p.name).slice(0,4)}
function applyFamilySearch(){const grid=document.getElementById('family-grid');if(!grid)return;const cards=new Map([...grid.querySelectorAll('[data-family]')].map(el=>[el.dataset.family,el])),matched=state.families.filter(familyMatches);if(queryTokens().length)matched.sort((a,b)=>familySearchScore(a)-familySearchScore(b)||String(a.responsible||'').localeCompare(String(b.responsible||''),'pt-BR'));for(const x of state.families){const card=cards.get(x.id);if(card)card.classList.add('hidden')}for(const x of matched){const card=cards.get(x.id);if(!card)continue;card.classList.remove('hidden');grid.appendChild(card);const hit=card.querySelector('[data-search-hit]'),names=matchingNames(x);if(hit){if(queryTokens().length){hit.classList.remove('hidden');hit.textContent=names.length?'🔎 Encontrado: '+names.map(T).join(' · '):'🔎 Correspondência no arrimo, família ou endereço'}else{hit.classList.add('hidden');hit.textContent=''}}}const count=document.getElementById('family-result-count'),empty=document.getElementById('family-empty');if(count)count.textContent=queryTokens().length?`${matched.length} família(s) encontrada(s) para “${state.q.trim()}”`:`${matched.length} família(s) neste filtro`;if(empty)empty.classList.toggle('hidden',matched.length>0)}
function renderFamilies(){const s=stats();app.innerHTML=`<section class="hero"><h1>👥 Famílias</h1><p>Cobertura do mês, arrimo e condições da microárea puxados do Supabase em tempo real.</p></section><div class="grid-kpi"><div class="kpi blue"><b>${s.families}</b><span>Famílias vigentes</span></div><div class="kpi"><b>${s.people}</b><span>Pessoas ativas</span></div><div class="kpi green"><b>${s.visited}</b><span>Visitadas no mês</span></div><div class="kpi red"><b>${s.pending}</b><span>Sem visita no mês</span></div></div><div class="card"><div class="chips">${Object.entries(FILTERS).map(([id,[label]])=>`<button class="chip ${state.filter===id?'on':''}" data-filter="${id}">${E(label)}</button>`).join('')}</div><div style="height:10px"></div><input type="search" class="search" id="family-search" placeholder="Digite MAR, Marcelo, rua, família…" value="${E(state.q)}" autocomplete="off" autocapitalize="none" spellcheck="false" enterkeyhint="search"><div class="search-note" id="family-result-count"></div></div><div class="family-grid" id="family-grid">${state.families.map(familyCard).join('')}</div><div class="empty hidden" id="family-empty">Nenhuma família encontrada.</div>`;app.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;app.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('on',x.dataset.filter===state.filter));applyFamilySearch()});const input=document.getElementById('family-search');input.oninput=e=>{state.q=e.currentTarget.value;applyFamilySearch()};app.querySelectorAll('[data-family]').forEach(b=>b.onclick=()=>openFamily(b.dataset.family));applyFamilySearch()}
function openFamily(id){const x=state.families.find(z=>z.id===id);if(!x)return;const m=modal(`<button class="close" data-close>×</button><h2>${E(T(x.responsible||'Família'))}</h2><div class="sub">Família ${E(x.code||'—')} · ${E([x.street,x.number,x.neighborhood].filter(Boolean).join(', ')||'Sem endereço')}</div><div class="notice ${x.visited?'ok':'warn'}" style="margin-top:12px">${x.visited?'✓ Família visitada no mês.':'● Família ainda sem visita registrada no mês.'}</div><div class="section">Integrantes (${x.members.length})</div>${x.members.map(p=>`<div class="member ${p.person_visited_month?'visited':''}"><div class="member-name">${E(T(p.full_name))}${p===x.arrimo?' <span class="tag arrimo">ARRIMO</span>':''}</div><div class="member-meta">${age(p)!=null?age(p)+' anos · ':''}${E(p.relationship||p.role||'vínculo não informado')} · última visita ${E(F(p.last_visit))}</div><div class="family-meta">${pTags(p)||'<span class="tag">Sem marcador individual</span>'}</div><div class="member-actions"><button class="btn soft" data-person="${p.id}">Ver ficha</button><button class="btn teal" data-visit="${p.id}">Iniciar visita</button></div></div>`).join('')}`);m.el.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>openPerson(b.dataset.person));m.el.querySelectorAll('[data-visit]').forEach(b=>b.onclick=()=>openVisit(b.dataset.visit))}
async function openPerson(id){busy();try{const j=await api('main','person',{params:{id}}),p=j.person;if(!p)throw new Error('Paciente não localizado');const m=modal(`<button class="close" data-close>×</button><h2>${E(T(p.full_name))}</h2><div class="sub">Família ${E(p.family_code||'—')} · ${E([p.street,p.number,p.neighborhood].filter(Boolean).join(', ')||'Sem endereço')}</div><div class="family-meta" style="margin-top:10px">${pTags(p)||'<span class="tag">Sem marcadores</span>'}</div><div class="grid-kpi" style="margin-top:12px"><div class="kpi"><b style="font-size:18px">${E(F(p.birth_date))}</b><span>Nascimento</span></div><div class="kpi"><b style="font-size:18px">${E(F(p.last_visit))}</b><span>Última visita</span></div></div><div class="section">Condições registradas</div>${j.conditions?.length?j.conditions.map(c=>`<div class="member"><div class="member-name">${E(c.condition_name)}</div><div class="member-meta">${E(c.status||'')} · ${E(F(c.recorded_on))}</div></div>`).join(''):'<div class="empty">Nenhuma condição estruturada.</div>'}<div class="section">Visitas recentes</div>${j.visits?.length?j.visits.slice(0,8).map(v=>`<div class="member"><div class="member-name">${E(F(v.visit_date))} · ${E(v.status)}</div><div class="member-meta">${E(v.visit_type||'')} ${v.official?'· oficial':'· registro local'}</div></div>`).join(''):'<div class="empty">Sem visitas associadas.</div>'}<div class="row" style="margin-top:12px"><button class="btn teal" data-start>Iniciar visita</button><button class="btn primary" data-plan>Planejar visita</button></div>`);m.el.querySelector('[data-start]').onclick=()=>openVisit(id);m.el.querySelector('[data-plan]').onclick=()=>planPerson(id,p.full_name)}finally{busy(false)}}
function personalUrl(path,id){const u=new URL(path,location.href);u.searchParams.set('person',id);if(ACCESS)u.searchParams.set('k',ACCESS);return u.href}
function openVisit(id){location.href=personalUrl('../acs-visita-campo/',id)}
function planPerson(id,name=''){const m=modal(`<button class="close" data-close>×</button><h2>Planejar visita</h2><div class="sub">${E(T(name))}</div><label>Data</label><input id="pp-date" type="date" value="${state.routeDate||today()}"><label>Motivo</label><input id="pp-reason" value="Visita domiciliar"><label>Prioridade</label><select id="pp-pri"><option value="rotina">Rotina</option><option value="atencao">Atenção</option><option value="prioridade">Prioridade</option></select><button class="btn teal block" id="pp-save" style="margin-top:13px">Adicionar ao roteiro</button>`);m.el.querySelector('#pp-save').onclick=async()=>{try{busy();await api('plan','agenda_add',{method:'POST',body:{person_id:id,date:m.el.querySelector('#pp-date').value,reason:m.el.querySelector('#pp-reason').value,priority:m.el.querySelector('#pp-pri').value}});state.routeDate=m.el.querySelector('#pp-date').value;m.close();toast('Visita adicionada ao roteiro.');state.page='plan';renderNav();renderPlan()}catch(e){toast(e.message,'err')}finally{busy(false)}}}
async function renderPlan(){app.innerHTML=`<section class="hero"><h1>🗓️ Planejar</h1><p>Roteiro pendente e histórico concluído no Supabase, com editar e excluir.</p></section><div class="card"><label>Data do roteiro</label><input id="route-date" type="date" value="${E(state.routeDate)}"><div class="row" style="margin-top:10px"><button class="btn teal" id="insert-route">＋ Inserir visita</button><button class="btn soft" id="smart-route">✨ Sugestões</button></div></div><div id="route-box"><div class="empty">Carregando roteiro…</div></div>`;document.getElementById('route-date').onchange=e=>{state.routeDate=e.target.value;loadRoute()};document.getElementById('insert-route').onclick=()=>insertRouteModal();document.getElementById('smart-route').onclick=()=>smartRoute();await loadRoute()}
async function loadRoute(){const box=document.getElementById('route-box');if(!box)return;box.innerHTML='<div class="empty">Consultando Supabase…</div>';try{const [p,c]=await Promise.all([api('plan','route',{params:{date:state.routeDate}}),api('done','list',{params:{date:state.routeDate}})]),pending=p.rows||[],done=c.rows||[];box.innerHTML=`<div class="card"><div class="title">Roteiro do dia</div><div class="sub">${pending.length} pendente(s) · ${done.length} concluída(s)</div>${pending.length?pending.map((x,i)=>`<div class="route"><div class="route-head"><div class="order">${i+1}</div><div class="route-main"><div class="route-name">${E(T(x.patient_name))}</div><div class="route-reason">📍 ${E(x.address_text||'Sem endereço')}<br>${E(x.reason||'Visita domiciliar')}</div></div></div><div class="route-actions"><button class="btn teal" data-rvisit="${E(x.person_id)}">Iniciar</button><button class="btn soft" data-resched="${E(x.id)}">Remarcar</button><button class="btn gray" data-complete="${E(x.id)}">Concluir</button><button class="btn red" data-cancel="${E(x.id)}">Cancelar</button></div></div>`).join(''):'<div class="empty" style="margin-top:12px">Nenhuma visita pendente.</div>'}</div><div class="card"><div class="title">✅ Histórico concluído</div>${done.length?done.map((x,i)=>`<div class="route completed"><div class="route-head"><div class="order">${i+1}</div><div class="route-main"><div class="route-name">${E(T(x.patient_name))}</div><div class="route-reason">${E(x.reason||'Visita domiciliar')} · ${E(F(x.scheduled_date))}</div></div></div><div class="route-actions"><button class="btn soft" data-editdone="${E(x.id)}">✏️ Editar</button><button class="btn red" data-deldone="${E(x.id)}" data-name="${E(x.patient_name)}">🗑 Excluir</button></div></div>`).join(''):'<div class="empty">Nenhuma visita concluída nesta data.</div>'}</div>`;box.querySelectorAll('[data-rvisit]').forEach(b=>b.onclick=()=>openVisit(b.dataset.rvisit));box.querySelectorAll('[data-resched]').forEach(b=>b.onclick=()=>reschedule(b.dataset.resched));box.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>completeRoute(b.dataset.complete));box.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=()=>cancelRoute(b.dataset.cancel));box.querySelectorAll('[data-editdone]').forEach(b=>b.onclick=()=>editDone(done.find(x=>String(x.id)===b.dataset.editdone)));box.querySelectorAll('[data-deldone]').forEach(b=>b.onclick=()=>deleteDone(b.dataset.deldone,b.dataset.name))}catch(e){box.innerHTML=`<div class="notice warn">${E(e.message)}</div>`}}
function insertRouteModal(){const m=modal(`<button class="close" data-close>×</button><h2>Inserir visita</h2><label>Buscar paciente</label><input id="srch" placeholder="Nome, CPF, CNS ou família"><div id="srch-results" style="margin-top:10px"></div>`);let t;m.el.querySelector('#srch').oninput=e=>{clearTimeout(t);t=setTimeout(async()=>{const q=e.target.value.trim(),box=m.el.querySelector('#srch-results');if(q.length<2){box.innerHTML='';return}try{const j=await api('plan','search',{params:{q}});box.innerHTML=(j.rows||[]).map(p=>`<div class="member"><div class="member-name">${E(T(p.full_name))}</div><div class="member-meta">Família ${E(p.family_code||'—')} · ${E([p.street,p.number,p.neighborhood].filter(Boolean).join(', ')||'Sem endereço')}</div><button class="btn teal block" data-pick="${p.id}" data-name="${E(p.full_name)}" style="margin-top:8px">Adicionar ao roteiro</button></div>`).join('')||'<div class="empty">Nenhum resultado.</div>';box.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{m.close();planPerson(b.dataset.pick,b.dataset.name)})}catch(err){box.innerHTML=`<div class="notice warn">${E(err.message)}</div>`}},250)}}
async function smartRoute(){busy();try{const j=await api('plan','smart_preview',{params:{date:state.routeDate}});const rows=j.rows||[];if(!rows.length){toast(j.message||'Sem sugestões.','err');return}const m=modal(`<button class="close" data-close>×</button><h2>✨ Sugestões</h2><div class="sub">Prévia somente. Marque o que deseja adicionar.</div>${rows.map((x,i)=>`<label class="member" style="display:block"><input type="checkbox" data-smart="${E(x.person_id)}" style="width:auto;margin-right:8px"><b>${i+1}. ${E(T(x.full_name))}</b><div class="member-meta">${E((x.reasons||[]).join(' · '))}</div></label>`).join('')}<button class="btn teal block" id="accept-smart" style="margin-top:12px">Adicionar selecionadas</button>`);m.el.querySelector('#accept-smart').onclick=async()=>{const ids=[...m.el.querySelectorAll('[data-smart]:checked')].map(x=>x.dataset.smart);if(!ids.length)return toast('Selecione pelo menos uma sugestão.','err');try{busy();await api('plan','smart_accept',{method:'POST',body:{date:state.routeDate,explicit:true,person_ids:ids}});m.close();toast('Sugestões adicionadas.');loadRoute()}finally{busy(false)}}}catch(e){toast(e.message,'err')}finally{busy(false)}}
function reschedule(id){const m=modal(`<button class="close" data-close>×</button><h2>Remarcar visita</h2><label>Nova data</label><input id="new-date" type="date" value="${state.routeDate}"><button class="btn teal block" id="save-res" style="margin-top:12px">Salvar</button>`);m.el.querySelector('#save-res').onclick=async()=>{try{busy();await api('plan','agenda_reschedule',{method:'POST',body:{id,new_date:m.el.querySelector('#new-date').value}});m.close();toast('Visita remarcada.');loadRoute()}catch(e){toast(e.message,'err')}finally{busy(false)}}}
async function completeRoute(id){if(!confirm('Marcar esta visita como concluída no roteiro?'))return;try{busy();await api('plan','agenda_complete',{method:'POST',body:{id}});toast('Visita concluída no roteiro.');await loadPopulation(true);loadRoute()}catch(e){toast(e.message,'err')}finally{busy(false)}}
async function cancelRoute(id){if(!confirm('Cancelar esta visita do roteiro?'))return;try{busy();await api('plan','agenda_cancel',{method:'POST',body:{id}});toast('Visita cancelada.');loadRoute()}catch(e){toast(e.message,'err')}finally{busy(false)}}
function editDone(x){if(!x)return;const m=modal(`<button class="close" data-close>×</button><h2>Editar concluída</h2><div class="sub">${E(T(x.patient_name))}</div><label>Atividade / motivo</label><textarea id="ed-reason">${E(x.reason||'Visita domiciliar')}</textarea><label>Prioridade</label><select id="ed-pri"><option value="rotina" ${x.priority_block==='rotina'?'selected':''}>Rotina</option><option value="atencao" ${x.priority_block==='atencao'?'selected':''}>Atenção</option><option value="prioridade" ${x.priority_block==='prioridade'?'selected':''}>Prioridade</option><option value="sem visita" ${x.priority_block==='sem visita'?'selected':''}>Sem visita</option><option value="dm/dpoc" ${x.priority_block==='dm/dpoc'?'selected':''}>DM/DPOC</option><option value="idoso 80+" ${x.priority_block==='idoso 80+'?'selected':''}>Idoso 80+</option></select><button class="btn teal block" id="ed-save" style="margin-top:12px">Salvar alteração</button>`);m.el.querySelector('#ed-save').onclick=async()=>{try{busy();await api('done','edit',{method:'POST',body:{id:x.id,reason:m.el.querySelector('#ed-reason').value,priority_block:m.el.querySelector('#ed-pri').value}});m.close();toast('Concluída atualizada.');loadRoute()}catch(e){toast(e.message,'err')}finally{busy(false)}}}
async function deleteDone(id,name){if(!confirm(`Excluir ${name||'esta visita'} do histórico do roteiro?`))return;try{busy();await api('done','delete',{method:'POST',body:{id}});toast('Visita excluída do roteiro.');loadRoute()}catch(e){toast(e.message,'err')}finally{busy(false)}}
function renderData(){const s=stats();const items=[['Famílias visitadas',s.visited,'visited'],['Sem visita no mês',s.pending,'pending'],['HAS',s.has,'has'],['Diabetes',s.dm,'dm'],['Acamados',s.acam,'acam'],['Domiciliados',s.dom,'dom'],['Pessoas 65+',s.a65,'a65'],['Gestantes',s.preg,'preg'],['Crianças <2',s.c2,'c2']];app.innerHTML=`<section class="hero"><h1>▮▮▮ Dados</h1><p>Indicadores calculados com a população retornada pelo Supabase.</p></section><div class="grid-kpi"><div class="kpi blue"><b>${s.people}</b><span>Pessoas ativas</span></div><div class="kpi"><b>${s.families}</b><span>Famílias vigentes</span></div><div class="kpi green"><b>${s.visited}</b><span>Famílias visitadas</span></div><div class="kpi red"><b>${s.pending}</b><span>Sem visita</span></div></div><div class="indicator-grid">${items.map(([n,v,f])=>`<button class="indicator" data-ind="${f}"><b>${v}</b><span>${E(n)}</span></button>`).join('')}</div><div class="card" style="margin-top:13px"><div class="title">Fonte</div><div class="notice ok">Dados carregados ao vivo da função <b>acs-patient-fast</b> do projeto Supabase. Nenhum paciente está embutido neste HTML.</div></div>`;app.querySelectorAll('[data-ind]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.ind;state.page='families';renderNav();renderFamilies()})}
function reportRows(filter){const fn=FILTERS[filter]?.[1]||FILTERS.all[1];return state.families.filter(fn)}
function downloadCsv(rows,name){const escCsv=v=>'"'+String(v??'').replace(/"/g,'""')+'"',out=[['Família','Arrimo','Endereço','Status','Integrantes','Risco']].concat(rows.map(x=>[x.code,x.responsible,[x.street,x.number,x.neighborhood].filter(Boolean).join(', '),x.visited?'Visitada':'Sem visita',x.members.length,x.risk]));const blob=new Blob([out.map(r=>r.map(escCsv).join(';')).join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function renderReports(){const s=stats();app.innerHTML=`<section class="hero"><h1>📄 Relatórios</h1><p>Listas operacionais prontas para conferência e exportação.</p></section><div class="card"><div class="title">Cobertura do mês</div><div class="row"><button class="btn teal" data-r="visited">Visitadas (${s.visited})</button><button class="btn red" data-r="pending">Sem visita (${s.pending})</button></div></div><div class="card"><div class="title">Grupos prioritários</div><div class="toolbar"><button class="btn soft" data-r="has">HAS (${s.has})</button><button class="btn soft" data-r="dm">Diabetes (${s.dm})</button><button class="btn soft" data-r="acam">Acamados (${s.acam})</button><button class="btn soft" data-r="a65">65+ (${s.a65})</button><button class="btn soft" data-r="preg">Gestantes (${s.preg})</button></div></div><div id="report-list"></div>`;app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>showReport(b.dataset.r));showReport('pending')}
function showReport(f){const rows=reportRows(f),box=document.getElementById('report-list');if(!box)return;box.innerHTML=`<div class="card"><div class="title">${E(FILTERS[f]?.[0]||'Relatório')}</div><div class="row" style="margin-bottom:10px"><button class="btn teal" id="csv-report">Baixar CSV</button><button class="btn soft" id="open-filter">Abrir em Famílias</button></div><div style="overflow:auto"><table class="report-table"><thead><tr><th>Família</th><th>Arrimo</th><th>Status</th><th>Endereço</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${E(x.code||'—')}</td><td>${E(T(x.responsible||''))}</td><td>${x.visited?'Visitada':'Sem visita'}</td><td>${E([x.street,x.number].filter(Boolean).join(', ')||'Sem endereço')}</td></tr>`).join('')}</tbody></table></div></div>`;document.getElementById('csv-report').onclick=()=>downloadCsv(rows,`esf06-${f}-${today()}.csv`);document.getElementById('open-filter').onclick=()=>{state.filter=f;state.page='families';renderNav();renderFamilies()}}
function renderMore(){app.innerHTML=`<section class="hero"><h1>⚙️ Mais</h1><p>Estado da conexão e manutenção da versão única.</p></section><div class="card"><div class="title">Conexão</div><div class="notice ok">✅ Supabase conectado. A população é atualizada por consulta <b>no-store</b>.</div><div class="row" style="margin-top:12px"><button class="btn teal" id="refresh-all">↻ Atualizar tudo</button><button class="btn soft" id="copy-link">Copiar link pessoal</button></div></div><div class="card"><div class="title">Produção</div><div class="sub">Arquivo único de interface · sem service worker próprio · sem lista de pacientes embutida · Supabase como fonte de verdade.</div></div>`;document.getElementById('refresh-all').onclick=async()=>{try{await loadPopulation(true);toast('Dados atualizados do Supabase.');renderMore()}catch(e){toast(e.message,'err')}};document.getElementById('copy-link').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);toast('Link copiado.')}catch{toast('Não foi possível copiar.','err')}}}
const NAV=[['families','👥','Famílias'],['plan','🗓️','Planejar'],['data','▮▮▮','Dados'],['reports','📄','Relat.'],['more','⚙️','Mais']];
function renderNav(){nav.innerHTML=NAV.map(([id,ico,label])=>`<button class="nav-btn ${state.page===id?'on':''}" data-nav="${id}"><span>${ico}</span><span>${label}</span></button>`).join('');nav.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.page=b.dataset.nav;renderNav();renderPage();scrollTo({top:0,behavior:'instant'})})}
async function renderPage(){if(state.page==='families')return renderFamilies();if(state.page==='plan')return renderPlan();if(state.page==='data')return renderData();if(state.page==='reports')return renderReports();return renderMore()}
async function init(){if(!ACCESS){app.innerHTML='<div class="card"><div class="title">Link pessoal necessário</div><div class="notice warn">Abra esta página com o parâmetro <b>k</b> do seu acesso pessoal.</div></div>';renderNav();return}try{busy();const [pr]=await Promise.all([api('main','profile'),loadPopulation(true)]);state.profile=pr.profile||null;document.getElementById('profile-name').textContent=T(state.profile?.full_name||'Vitor Hugo Bernardo');document.getElementById('hello').textContent=greeting()+' · Supabase conectado';renderNav();await renderPage()}catch(e){app.innerHTML=`<div class="card"><div class="title">Falha ao abrir</div><div class="notice warn">${E(e.message)}</div></div>`;toast(e.message,'err')}finally{busy(false)}}
init();
})();
</script>
</body>
</html>
