.btn{border:0;border-radius:13px;padding:10px 13px;font-weight:900;min-height:44px}.btn.primary{background:var(--blue);color:#fff}.btn.teal{background:var(--teal);color:#fff}.btn.soft{background:#eaf2ff;color:#205dc2}.btn.red{background:#ffe9e9;color:#ad3136}.btn.gray{background:#eef2f6;color:#526176}.btn.block{width:100%}.row>.btn{flex:1}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form-row input,.form-row select,.form-row textarea,input,select,textarea{width:100%;border:1px solid #d9e1e9;border-radius:13px;padding:11px;background:#fff;color:var(--ink);min-height:44px}label{display:block;font-size:12px;font-weight:850;color:#526176;margin:10px 0 5px}.empty{background:#f0f3f7;border-radius:17px;padding:24px;text-align:center;color:#76869a}.route{border:1px solid var(--line);border-radius:17px;padding:13px;margin-bottom:9px;background:#fff}.route.completed{background:#f3fbf7;border-color:#c8e6d7}.route-head{display:flex;gap:10px}.order{width:34px;height:34px;border-radius:10px;background:#def3ee;color:#0c7668;display:grid;place-items:center;font-weight:900;flex:0 0 auto}.route-main{flex:1;min-width:0}.route-name{font-weight:900}.route-reason{font-size:12px;color:#68788e;margin-top:4px;line-height:1.4}.route-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.route-actions .btn{flex:1;min-width:95px}.section{margin:18px 0 8px;font-size:17px;font-weight:900}.indicator-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.indicator{border:1px solid var(--line);border-radius:17px;background:#fff;padding:14px;text-align:left;min-height:82px}.indicator b{font-size:24px;display:block}.indicator span{font-size:12px;color:#68788e}.report-table{width:100%;border-collapse:collapse;font-size:12px}.report-table th,.report-table td{border-bottom:1px solid #e6ebf0;padding:9px 5px;text-align:left;vertical-align:top}.report-table th{color:#64748b}.notice{padding:12px;border-radius:14px;background:#eef5ff;color:#4f6787;font-size:13px;line-height:1.45}.notice.warn{background:#fff7df;color:#7d631f}.notice.ok{background:#eaf9f2;color:#246d4f}.progress{height:8px;background:#edf1f4;border-radius:999px;overflow:hidden;margin-top:10px}.progress>span{display:block;height:100%;background:var(--teal)}

.back{position:fixed;inset:0;background:#071a3188;z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:12px}.modal{width:min(100%,650px);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;padding:18px;position:relative;box-shadow:0 16px 50px #0014}.close{position:absolute;right:12px;top:10px;width:44px;height:44px;border:0;border-radius:50%;background:#f0f3f7;font-size:22px}.modal h2{margin:0 50px 3px 0;font-size:21px}.member{border:1px solid var(--line);border-radius:16px;padding:12px;margin-top:9px}.member.visited{border-left:5px solid var(--green)}.member-name{font-weight:900}.member-meta{font-size:12px;color:#708096;margin-top:4px;line-height:1.4}.member-actions{display:flex;gap:7px;margin-top:9px}.member-actions .btn{flex:1}.toast{position:fixed;left:16px;right:16px;bottom:94px;z-index:150;background:#0c7569;color:#fff;border-radius:13px;padding:12px 14px;font-weight:850;box-shadow:0 8px 30px #0002}.toast.err{background:#b43b40}.loading{position:fixed;inset:0;z-index:200;background:#ffffffb8;display:grid;place-items:center}.spinner{width:42px;height:42px;border:4px solid #dce6ef;border-top-color:var(--teal);border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
@media(min-width:720px){.family-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.indicator-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.back{align-items:center}}@media(max-width:520px){.form-row{grid-template-columns:1fr}.version{font-size:9px;padding:7px 8px}.name{font-size:18px}.head{gap:8px}.logo{width:47px;height:47px}.status{white-space:normal;text-align:center}.family-top{align-items:stretch}}

<body>
<header><div class="head"><div class="logo" aria-hidden="true">+</div><div><div class="kicker">Gestão ACS 360</div><div class="name" id="profile-name">ESF06</div><div class="hello" id="hello">Carregando dados do Supabase…</div></div><div class="version">PRODUÇÃO · GEO</div></div></header>
<main id="app"></main>
<nav aria-label="Navegação principal"><div class="nav-inner" id="nav"></div></nav>
<div id="loading" class="loading hidden" role="status" aria-label="Carregando"><div class="spinner"></div></div>
<div id="toasts" aria-live="polite"></div>
<script>
(()=>{'use strict';
const BASE='https://pvwqxpqetdxtmqqypqjk.supabase.co/functions/v1/';
const END={main:'acs-visita-api',fast:'acs-patient-fast',plan:'acs-planner-v32',done:'acs-route-completed-v40',recad:'acs-recadastro-v2'};
let ACCESS=new URL(location.href).searchParams.get('k')||localStorage.getItem('esf06_visit_key')||'';
if(ACCESS)localStorage.setItem('esf06_visit_key',ACCESS);
const state={page:'families',rows:[],families:[],profile:null,filter:'all',sort:'name',q:'',routeDate:new Date().toISOString().slice(0,10),busy:false,recadOverview:null,recadStreet:null};
const app=document.getElementById('app'),nav=document.getElementById('nav');
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const T=s=>String(s||'').toLowerCase().replace(/(^|\s)\S/g,m=>m.toUpperCase());
const F=d=>{if(!d)return'—';const p=String(d).slice(0,10).split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:String(d)};
const age=p=>{if(p?.age!=null&&Number.isFinite(Number(p.age)))return Number(p.age);if(!p?.birth_date)return null;const b=new Date(String(p.birth_date).slice(0,10)+'T12:00:00'),n=new Date();let a=n.getFullYear()-b.getFullYear(),m=n.getMonth()-b.getMonth();return m<0||(m===0&&n.getDate()<b.getDate())?a-1:a};
const today=()=>new Date().toISOString().slice(0,10);
const walkM=x=>x?.geo_walk_distance_esf_m==null||!Number.isFinite(Number(x.geo_walk_distance_esf_m))?null:Number(x.geo_walk_distance_esf_m);
const walkS=x=>x?.geo_walk_duration_s==null||!Number.isFinite(Number(x.geo_walk_duration_s))?null:Number(x.geo_walk_duration_s);
const walkMin=x=>walkS(x)==null?null:Math.max(1,Math.round(walkS(x)/60));
const fmtWalk=m=>m==null?'—':m<1000?`${Math.round(m)} m`:`${(m/1000).toFixed(1).replace('.',',')} km`;
function geoPrecision(x){const p=String(x?.geo_walk_precision||'');if(x?.geo_verified)return'GPS confirmado';if(p.includes('pointaddress'))return'Endereço individual + rota a pé';if(p.includes('calibrated'))return'Número calibrado + rota a pé';if(p.includes('interpolated'))return'Número estimado + rota a pé';return'Rota a pé estimada'}
function geoLine(x){const m=walkM(x),min=walkMin(x);if(m==null)return'<div class="geo-line pending"><span>📍 Geolocalização pendente</span><span class="geo-pill pending">manual depois</span></div>';return `<div class="geo-line"><span>🚶 <b>${E(fmtWalk(m))}</b>${min!=null?` · ~${min} min a pé`:''}</span><span class="geo-pill">${x?.geo_verified?'GPS':'estimado'}</span></div>`}
function geoPanel(x){const m=walkM(x),min=walkMin(x);if(m==null)return'<div class="geo-panel pending"><div class="big">📍 Sem geolocalização</div><div class="sub">Este endereço ficou para atualização manual ou confirmação posterior.</div></div>';return `<div class="geo-panel"><div class="big">🚶 ${E(fmtWalk(m))}${min!=null?` · ~${min} min`:''}</div><div class="sub">Distância caminhando até a ESF 6 Pontal · ${E(geoPrecision(x))}${x?.geo_verified?' · confirmado':' · estimativa territorial'}</div></div>`}
function toast(msg,type='ok'){const d=document.createElement('div');d.className='toast '+(type==='err'?'err':'');d.setAttribute('role',type==='err'?'alert':'status');d.textContent=msg;document.getElementById('toasts').appendChild(d);setTimeout(()=>d.remove(),3500)}
function busy(v=true){state.busy=v;document.getElementById('loading').classList.toggle('hidden',!v)}
async function api(which,name,{method='GET',params={},body}={}){const u=new URL(BASE+END[which]);u.searchParams.set('api',name);u.searchParams.set('k',ACCESS);u.searchParams.set('_',Date.now());Object.entries(params).forEach(([k,v])=>u.searchParams.set(k,String(v)));const r=await fetch(u,{method,headers:body?{'content-type':'application/json'}:undefined,body:body?JSON.stringify(body):undefined,cache:'no-store'});const j=await r.json().catch(()=>({error:'Resposta inválida do servidor'}));if(!r.ok)throw new Error(j.error||'Falha no Supabase');return j}
function modal(html){const b=document.createElement('div');b.className='back';b.innerHTML=`<div class="modal" role="dialog" aria-modal="true">${html}</div>`;document.body.appendChild(b);const close=()=>b.remove();b.onclick=e=>{if(e.target===b)close()};b.querySelector('[data-close]')?.addEventListener('click',close);b.querySelector('[data-close]')?.focus();return{el:b,close}}
function greeting(){const h=new Date().getHours();return h<12?'Bom dia!':h<18?'Boa tarde!':'Boa noite!'}
async function copyText(text,label='Texto'){try{await navigator.clipboard.writeText(text);toast(label+' copiado.')}catch{toast('Não foi possível copiar.','err')}}
const flagLabel={hipertenso:'HAS',diabetico:'Diabetes',acamado:'Acamado',domiciliado:'Domiciliado',gestante:'Gestante',puerpera:'Puérpera',oncologia:'Oncologia',saudeMental:'Saúde mental',saude_mental:'Saúde mental',asma:'Asma',pcd:'PCD',tabagista:'Tabagismo'};
function pTags(p){const a=[],seen=new Set(),f=p.flags||{};for(const [k,v] of Object.entries(f)){if(v!==true||!flagLabel[k]||seen.has(flagLabel[k]))continue;seen.add(flagLabel[k]);let c=k==='hipertenso'?'has':k==='diabetico'?'dm':['acamado','domiciliado','oncologia'].includes(k)?'high':k==='gestante'||k==='puerpera'?'preg':k.includes('saude')?'mental':'';a.push(`<span class="tag ${c}">${E(flagLabel[k])}</span>`)}const a0=age(p);if(a0!=null&&a0>=65)a.push(`<span class="tag age">${a0>=80?'80+':'65+'} · ${a0} anos</span>`);if(a0!=null&&a0<2)a.push('<span class="tag child">&lt;2 anos</span>');return a.join('')}
function familyTags(x){const f=x.family_flags||{},a=[];if(f.hipertenso)a.push('<span class="tag has">Família c/ HAS</span>');if(f.diabetico)a.push('<span class="tag dm">Família c/ Diabetes</span>');if(f.acamado)a.push('<span class="tag high">Família c/ Acamado</span>');if(f.domiciliado)a.push('<span class="tag high">Família c/ Domiciliado</span>');if(f.gestante)a.push('<span class="tag preg">Família c/ Gestante</span>');if(f.idade_65_mais||x.members.some(p=>age(p)>=65))a.push('<span class="tag age">Família 65+</span>');if(f.menor_1_ano||f.idade_1_a_menor_2||x.members.some(p=>age(p)!=null&&age(p)<2))a.push('<span class="tag child">Criança &lt;2</span>');return a.join('')}
function groupFamilies(){const m=new Map;for(const p of state.rows){const id=String(p.family_id);if(!m.has(id))m.set(id,{id,code:p.family_code,responsible:p.responsible_name,street:p.street,number:p.number,neighborhood:p.neighborhood,family_flags:p.family_flags||{},risk:p.family_risk||'Sem risco',visited:!!p.family_visited_month,geo_walk_distance_esf_m:p.geo_walk_distance_esf_m,geo_walk_duration_s:p.geo_walk_duration_s,geo_walk_method:p.geo_walk_method,geo_walk_precision:p.geo_walk_precision,geo_verified:!!p.geo_verified,members:[]});m.get(id).members.push(p)}for(const x of m.values()){x.arrimo=x.members.find(p=>p.role==='responsavel')||x.members.find(p=>N(p.full_name)===N(x.responsible))||x.members[0];x.searchText=N([x.responsible,x.code,x.street,x.number,x.neighborhood,...x.members.map(p=>p.full_name)].filter(Boolean).join(' ')).replace(/\s+/g,' ').trim();x.memberSearch=x.members.map(p=>({name:p.full_name,n:N(p.full_name).replace(/\s+/g,' ').trim()}))}state.families=[...m.values()]}
async function loadPopulation(){busy();try{const j=await api('fast','list');state.rows=j.rows||[];groupFamilies()}finally{busy(false)}}
function stats(){const f=state.families,r=state.rows,geo=f.filter(x=>walkM(x)!=null),near=geo.filter(x=>walkM(x)<=500).length,mid=geo.filter(x=>walkM(x)>500&&walkM(x)<=1000).length,far=geo.filter(x=>walkM(x)>1000).length;return{people:r.length,families:f.length,visited:f.filter(x=>x.visited).length,pending:f.filter(x=>!x.visited).length,has:r.filter(p=>p.flags?.hipertenso).length,dm:r.filter(p=>p.flags?.diabetico).length,acam:r.filter(p=>p.flags?.acamado).length,dom:r.filter(p=>p.flags?.domiciliado).length,a65:r.filter(p=>age(p)>=65).length,preg:r.filter(p=>p.flags?.gestante).length,c2:r.filter(p=>age(p)!=null&&age(p)<2).length,geo:geo.length,nogeo:f.length-geo.length,near,mid,far,geoPct:f.length?Math.round(geo.length*100/f.length):0}}
const FILTERS={all:['Todas',x=>true],pending:['Sem visita',x=>!x.visited],visited:['Visitadas',x=>x.visited],has:['HAS',x=>x.members.some(p=>p.flags?.hipertenso)||x.family_flags?.hipertenso],dm:['Diabetes',x=>x.members.some(p=>p.flags?.diabetico)||x.family_flags?.diabetico],acam:['Acamado',x=>x.members.some(p=>p.flags?.acamado)||x.family_flags?.acamado],dom:['Domiciliado',x=>x.members.some(p=>p.flags?.domiciliado)||x.family_flags?.domiciliado],a65:['65+',x=>x.members.some(p=>age(p)>=65)],preg:['Gestante',x=>x.members.some(p=>p.flags?.gestante)],c2:['<2 anos',x=>x.members.some(p=>age(p)!=null&&age(p)<2)],near:['≤500 m',x=>walkM(x)!=null&&walkM(x)<=500],mid:['500 m–1 km',x=>walkM(x)>500&&walkM(x)<=1000],far:['>1 km',x=>walkM(x)>1000],nogeo:['Sem geo',x=>walkM(x)==null]};
function famNo(x){const n=String(x.number||'').match(/\d+/);return n?Number(n[0]):999999}
function familyCmp(a,b){if(state.sort==='near')return (walkM(a)==null)-(walkM(b)==null)||(walkM(a)??1e9)-(walkM(b)??1e9)||String(a.responsible||'').localeCompare(String(b.responsible||''),'pt-BR');if(state.sort==='far')return (walkM(a)==null)-(walkM(b)==null)||(walkM(b)??-1)-(walkM(a)??-1)||String(a.responsible||'').localeCompare(String(b.responsible||''),'pt-BR');if(state.sort==='street')return String(a.street||'ZZZ').localeCompare(String(b.street||'ZZZ'),'pt-BR')||famNo(a)-famNo(b)||String(a.responsible||'').localeCompare(String(b.responsible||''),'pt-BR');return String(a.responsible||'').localeCompare(String(b.responsible||''),'pt-BR')}
function familyCard(x){return `<article class="family ${x.visited?'visited':'pending'}" data-family="${E(x.id)}" tabindex="0"><div class="family-top"><div class="family-main"><div class="code">Família ${E(x.code||'—')}</div><div class="family-name">${E(T(x.responsible||x.arrimo?.full_name||'Responsável não informado'))}</div><div class="address">📍 ${E([x.street,x.number,x.neighborhood].filter(Boolean).join(', ')||'Endereço sem dado')}</div>${geoLine(x)}</div><span class="status ${x.visited?'ok':'due'}">${x.visited?'✓ Visitada no mês':'● Sem visita no mês'}</span></div><div class="family-meta"><span class="tag arrimo">🏠 ARRIMO</span>${familyTags(x)}</div><div class="search-hit hidden" data-search-hit></div><div class="family-foot"><span>👥 ${x.members.length} integrante(s)</span><span>${E(x.risk||'Sem risco')}</span><strong>Ver família ›</strong></div></article>`}
function queryTokens(){return N(state.q).replace(/\s+/g,' ').trim().split(' ').filter(Boolean)}
function familyMatches(x){const f=FILTERS[state.filter]?.[1]||FILTERS.all[1],tokens=queryTokens();return f(x)&&(!tokens.length||tokens.every(t=>x.searchText.includes(t)))}
function familySearchScore(x){const q=N(state.q).replace(/\s+/g,' ').trim();if(!q)return 99;const resp=N(x.responsible||''),names=x.memberSearch||[];if(resp.startsWith(q))return 0;if(names.some(p=>p.n.startsWith(q)))return 1;if(resp.includes(q))return 2;if(names.some(p=>p.n.includes(q)))return 3;return 4}
function matchingNames(x){const tokens=queryTokens();if(!tokens.length)return[];return(x.memberSearch||[]).filter(p=>tokens.every(t=>p.n.includes(t))).map(p=>p.name).slice(0,4)}
function applyFamilySearch(){const grid=document.getElementById('family-grid');if(!grid)return;const cards=new Map([...grid.querySelectorAll('[data-family]')].map(el=>[el.dataset.family,el])),matched=state.families.filter(familyMatches);matched.sort((a,b)=>queryTokens().length?(familySearchScore(a)-familySearchScore(b)||familyCmp(a,b)):familyCmp(a,b));for(const x of state.families){const card=cards.get(x.id);if(card)card.classList.add('hidden')}for(const x of matched){const card=cards.get(x.id);if(!card)continue;card.classList.remove('hidden');grid.appendChild(card);const hit=card.querySelector('[data-search-hit]'),names=matchingNames(x);if(hit){if(queryTokens().length){hit.classList.remove('hidden');hit.textContent=names.length?'🔎 Encontrado: '+names.map(T).join(' · '):'🔎 Correspondência no arrimo, família ou endereço'}else{hit.classList.add('hidden');hit.textContent=''}}}const count=document.getElementById('family-result-count'),empty=document.getElementById('family-empty');if(count)count.textContent=queryTokens().length?`${matched.length} família(s) encontrada(s) para “${state.q.trim()}”`:`${matched.length} família(s) neste filtro`;if(empty)empty.classList.toggle('hidden',matched.length>0)}

ssList.toggle('on',x.dataset.filter===state.filter));applyFamilySearch()});const input=document.getElementById('family-search');input.oninput=e=>{state.q=e.currentTarget.value;applyFamilySearch()};document.getElementById('family-sort').onchange=e=>{state.sort=e.target.value;applyFamilySearch()};app.querySelectorAll('[data-family]').forEach(b=>{b.onclick=()=>openFamily(b.dataset.family);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openFamily(b.dataset.family)}}});applyFamilySearch()}

const REC_FIELDS=[['acamado','Acamados'],['deficiencia','Deficiência'],['transtorno_mental_alto_risco','Transtornos mentais de alto risco'],['deficiencia_intelectual','Deficiências intelectuais'],['saneamento_ruim','Saneamento ruim'],['desnutricao','Desnutrição'],['abuso_substancia_psicoativa','Abuso de substância psicoativa'],['adulto_sem_renda','>18 anos sem renda'],['analfabetismo','Analfabetismo'],['menor_2_anos','Menor de 2 anos'],['maior_60_anos','Maior de 60 anos'],['hipertensao','Hipertensão'],['diabetes','Diabetes'],['hemodialise','Hemodializado'],['gestante','Gestante'],['povos_originarios','Povos originários'],['doencas_transmissiveis','Hepatites / hanseníase / leishmaniose / tuberculose'],['problema_respiratorio','Problema respiratório com uso de medicamento'],['lgbt','População LGBT'],['cancer','Câncer']];
async function recApi(action,payload={}){return api('recad',action,{method:'POST',body:payload})}
function recKnown(fam,saved={}){const fs=(fam?.members||[]).map(p=>p.flags||{}),has=k=>fs.some(x=>x[k]===true);const ages=(fam?.members||[]).map(age).filter(x=>x!=null),allAge=!!fam?.members?.length&&ages.length===fam.members.length;const out={acamado:has('acamado')?true:null,deficiencia:has('pcd')?true:null,transtorno_mental_alto_risco:(has('saudeMental')||has('saude_mental'))?true:null,menor_2_anos:ages.some(x=>x<2)?true:(allAge?false:null),maior_60_anos:ages.some(x=>x>=60)?true:(allAge?false:null),hipertensao:has('hipertenso')?true:null,diabetes:has('diabetico')?true:null,gestante:has('gestante')?true:null,problema_respiratorio:has('asma')?true:null,cancer:has('oncologia')?true:null};for(const [k] of REC_FIELDS)if(saved[k]!==undefined&&saved[k]!==null)out[k]=saved[k];return out}
function recStatusBadge(s){if(s==='mesma_familia')return'<span class="status ok">✓ Mesma família</span>';if(s==='nao_visitado')return'<span class="status due">● Não visitado</span>';return'<span class="status" style="background:#fff2d6;color:#7f5a00">'+E(REC_STATUS[s]||s)+'</span>'}
function recStreetCard(s){const done=(s.total||0)-(s.nao_visitado||0),pct=s.total?Math.round(done*100/s.total):0,gm=s.geo_avg_m==null?'—':fmtWalk(Number(s.geo_avg_m));return `<div class="card" data-rec-street="${E(s.street)}" style="border-left:6px solid var(--teal)"><div class="row"><div style="flex:1"><div class="title">${E(T(s.street))}</div><div class="sub">${s.total} endereço(s) · ${s.nao_visitado} não visitado(s) · ${pct}% percorrido</div><div class="search-note">🚶 média ${E(gm)} até a ESF · geolocalização ${E(s.geo_calculadas||0)}/${E(s.total||0)}</div></div><button class="btn teal" data-open-rec-street="${encodeURIComponent(s.street)}">Abrir rua</button></div><div class="progress"><span style="width:${pct}%"></span></div></div>`}
async function renderRecadastro(){busy();try{const j=await recApi('overview');state.recadOverview=j;state.recadStreet=null;const s=j.summary||{},streets=j.streets||[];app.innerHTML=`<section class="hero"><h1>🏘️ Recadastramento</h1><p>Rua por rua, endereço por endereço. A distância a pé entra automaticamente quando já foi calculada; os casos sem geo ficam para atualização manual.</p></section><div class="grid-kpi"><div class="kpi blue"><b>${E(s.total||0)}</b><span>Famílias vigentes</span></div><div class="kpi red"><b>${E(s.nao_visitado||0)}</b><span>Não visitadas</span></div><div class="kpi green"><b>${E(s.concluidas||0)}</b><span>Endereços resolvidos</span></div><div class="kpi amber"><b>${E(s.voltar_depois||0)}</b><span>Voltar depois</span></div><div class="kpi blue"><b>${E(s.geo_calculadas||0)}</b><span>Com rota a pé</span></div><div class="kpi amber"><b>${E(s.geo_pendentes||0)}</b><span>Geo manual/posterior</span></div></div><div class="card"><div class="notice ok"><b>Distância operacional = caminho a pé até a ESF.</b><br>O navegador não chama mapa externo ao abrir a ficha; ele apenas lê o cálculo já salvo no Supabase.</div></div><div class="card"><input type="search" class="search" id="rec-street-search" placeholder="Buscar rua..." autocomplete="off"></div><div id="rec-street-list">${streets.map(recStreetCard).join('')}</div>`;app.querySelectorAll('[data-open-rec-street]').forEach(b=>b.onclick=()=>openRecStreet(decodeURIComponent(b.dataset.openRecStreet)));document.getElementById('rec-street-search').oninput=e=>{const q=N(e.target.value);app.querySelectorAll('[data-rec-street]').forEach(el=>el.classList.toggle('hidden',!N(el.dataset.recStreet).includes(q)))}}catch(e){app.innerHTML=`<div class="card"><div class="notice warn">${E(e.message)}</div></div>`;toast(e.message,'err')}finally{busy(false)}}
async function openRecStreet(street){busy();try{const j=await recApi('street',{street});state.recadStreet=j;app.innerHTML=`<section class="hero"><h1>📍 ${E(T(street))}</h1><p>${j.rows.length} família(s) em ordem de número.</p></section><div class="row"><button class="btn soft" id="rec-back">← Todas as ruas</button></div><div class="card" style="margin-top:10px"><input type="search" class="search" id="rec-house-search" placeholder="Buscar número, responsável ou família..." autocomplete="off"></div><div id="rec-house-list">${j.rows.map(x=>`<article class="family ${x.visit_status==='nao_visitado'?'pending':'visited'}" data-rec-house="${E([x.number,x.responsible_name,x.family_code].join(' '))}" tabindex="0"><div class="family-top"><div class="family-main"><div class="code">Família ${E(x.family_code||'—')}</div><div class="family-name">Nº ${E(x.number||'s/n')} · ${E(T(x.responsible_name||'Responsável não informado'))}</div><div class="address">📍 ${E([x.street,x.number,x.reference,x.neighborhood].filter(Boolean).join(', ')||'Sem endereço')}</div>${geoLine(x)}</div>${recStatusBadge(x.visit_status)}</div><div class="family-foot"><span>👥 ${E(x.member_count??'—')} morador(es)</span><strong data-open-rec-family="${E(x.id)}">Abrir domicílio ›</strong></div></article>`).join('')}</div>`;document.getElementById('rec-back').onclick=renderRecadastro;app.querySelectorAll('[data-open-rec-family]').forEach(b=>b.onclick=e=>{e.stopPropagation();openRecFamily(b.dataset.openRecFamily)});app.querySelectorAll('[data-rec-house]').forEach(card=>{const open=()=>openRecFamily(card.querySelector('[data-open-rec-family]').dataset.openRecFamily);card.onclick=open;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}});document.getElementById('rec-house-search').oninput=e=>{const q=N(e.target.value);app.querySelectorAll('[data-rec-house]').forEach(el=>el.classList.toggle('hidden',!N(el.dataset.recHouse).includes(q)))}}catch(e){toast(e.message,'err')}finally{busy(false)}}
function recTri(label,key,val){const c=v=>v===val?(v===true?'yes':v===false?'no':'unk'):'';return `<div class="member"><div class="member-name">${E(label)}</div><div class="row" data-rec-field="${E(key)}" style="margin-top:8px"><button class="btn ${c(true)?'teal':'gray'}" data-v="true">Sim</button><button class="btn ${c(false)?'soft':'gray'}" data-v="false">Não</button><button class="btn ${c(null)?'primary':'gray'}" data-v="null">Não confirmado</button></div></div>`}
async function openRecFamily(id){busy();try{const j=await recApi('family',{id}),f=j.family||{},saved=j.recadastro||{},visit=j.visit||{},fam=state.families.find(x=>x.id===id),known=recKnown(fam,saved),members=fam?.members||[];let status=visit.visit_status||'nao_visitado',vals={};for(const [k] of REC_FIELDS)vals[k]=known[k]??null;const savedDist=saved.distancia_km!==undefined&&saved.distancia_km!==null&&saved.distancia_km!==''?Number(saved.distancia_km):null,autoDist=walkM(f)!=null?Number((walkM(f)/1000).toFixed(2)):null,distVal=savedDist??autoDist;const geoHelp=walkM(f)!=null?`🚶 Pré-calculada: ${fmtWalk(walkM(f))}${walkMin(f)!=null?` · ~${walkMin(f)} min a pé`:''}. Pode corrigir manualmente se necessário.`:'📍 Sem geolocalização pré-calculada. Deixe em branco ou preencha manualmente quando confirmar.';const m=modal(`<button class="close" data-close aria-label="Fechar">×</button><h2>${E(T(f.responsible_name||'Família'))}</h2><div class="sub">Família ${E(f.family_code||'—')} · ${E([f.street,f.number,f.neighborhood].filter(Boolean).join(', '))}</div>${geoPanel(f)}<div class="section">1. Quem mora aqui hoje?</div><div class="row" id="rec-status-buttons">${Object.entries(REC_STATUS).filter(([k])=>k!=='nao_visitado').map(([k,v])=>`<button class="btn ${status===k?'primary':'gray'}" data-rec-status="${k}">${E(v)}</button>`).join('')}</div><div id="rec-same" class="${status==='mesma_familia'?'':'hidden'}"><div class="section">2. Conferir moradores</div><div class="notice">${members.length?members.map(p=>E(T(p.full_name))+(p.role==='responsavel'?' · ARRIMO':'')).join('<br>'):'Integrantes ainda não carregados.'}</div><div class="form-row"><div><label>Data do recadastramento</label><input id="rec-date" type="date" value="${E(saved.data_recadastramento||today())}"></div><div><label>Nº de moradores</label><input id="rec-mor" type="number" min="0" value="${E(saved.moradores??f.member_count??'')}"></div><div><label>Nº de cômodos</label><input id="rec-com" type="number" min="1" value="${E(saved.comodos??'')}"></div><div><label>Distância a pé da unidade (km)</label><input id="rec-dist" type="number" min="0" step="0.01" value="${distVal==null?'':E(distVal)}"><div class="search-note">${E(geoHelp)}</div></div></div><div class="section">3. Condicionantes</div><div class="notice ok">Campos já conhecidos pelo Gestão aparecem pré-selecionados. Confirme ou corrija.</div><div id="rec-fields">${REC_FIELDS.map(([k,l])=>recTri(l,k,vals[k])).join('')}</div></div><div id="rec-new" class="${status==='outra_familia'?'':'hidden'}"><div class="section">Nova família encontrada</div><label>Responsável atual</label><input id="rec-new-name" value="${E(visit.current_responsible_name||'')}"><label>Nº de moradores</label><input id="rec-new-count" type="number" min="0" value="${E(visit.current_member_count??'')}"></div><div class="section">Observações</div><textarea id="rec-notes" rows="3">${E(visit.notes||'')}</textarea><button class="btn teal block" id="rec-save" style="margin-top:14px">Salvar recadastramento</button>`);const setStatus=s=>{status=s;m.el.querySelectorAll('[data-rec-status]').forEach(b=>b.className='btn '+(b.dataset.recStatus===s?'primary':'gray'));m.el.querySelector('#rec-same').classList.toggle('hidden',s!=='mesma_familia');m.el.querySelector('#rec-new').classList.toggle('hidden',s!=='outra_familia')};m.el.querySelectorAll('[data-rec-status]').forEach(b=>b.onclick=()=>setStatus(b.dataset.recStatus));m.el.querySelectorAll('[data-rec-field]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{const v=b.dataset.v==='true'?true:b.dataset.v==='false'?false:null;vals[g.dataset.recField]=v;g.querySelectorAll('button').forEach(x=>x.className='btn gray');b.className='btn '+(v===true?'teal':v===false?'soft':'primary')}));m.el.querySelector('#rec-save').onclick=async()=>{try{busy();const rec={};for(const [k] of REC_FIELDS)rec[k]=vals[k];rec.data_recadastramento=m.el.querySelector('#rec-date')?.value||null;rec.moradores=m.el.querySelector('#rec-mor')?.value===''?null:Number(m.el.querySelector('#rec-mor')?.value);rec.comodos=m.el.querySelector('#rec-com')?.value===''?null:Number(m.el.querySelector('#rec-com')?.value);rec.distancia_km=m.el.querySelector('#rec-dist')?.value===''?null:Number(m.el.querySelector('#rec-dist')?.value);await recApi('save',{family_id:id,status,notes:m.el.querySelector('#rec-notes').value,current_responsible_name:status==='outra_familia'?m.el.querySelector('#rec-new-name')?.value:f.responsible_name,current_member_count:status==='outra_familia'?(m.el.querySelector('#rec-new-count')?.value===''?null:Number(m.el.querySelector('#rec-new-count')?.value)):rec.moradores,recadastro:rec,new_family:status==='outra_familia'?{responsible_name:m.el.querySelector('#rec-new-name')?.value,member_count:m.el.querySelector('#rec-new-count')?.value===''?null:Number(m.el.querySelector('#rec-new-count')?.value)}:null});m.close();toast('Recadastramento salvo.');await openRecStreet(state.recadStreet.street)}catch(e){toast(e.message,'err')}finally{busy(false)}}}catch(e){toast(e.message,'err')}finally{busy(false)}}
function renderData(){const s=stats();const items=[['Famílias visitadas',s.visited,'visited'],['Sem visita no mês',s.pending,'pending'],['HAS',s.has,'has'],['Diabetes',s.dm,'dm'],['Acamados',s.acam,'acam'],['Domiciliados',s.dom,'dom'],['Pessoas 65+',s.a65,'a65'],['Gestantes',s.preg,'preg'],['Crianças <2',s.c2,'c2'],['Até 500 m',s.near,'near'],['500 m–1 km',s.mid,'mid'],['Acima de 1 km',s.far,'far'],['Sem geolocalização',s.nogeo,'nogeo']];app.innerHTML=`<section class="hero"><h1>▮▮▮ Dados</h1><p>Indicadores calculados ao vivo com a população e as rotas a pé retornadas pelo Supabase.</p></section><div class="grid-kpi"><div class="kpi blue"><b>${s.people}</b><span>Pessoas ativas</span></div><div class="kpi"><b>${s.families}</b><span>Famílias vigentes</span></div><div class="kpi green"><b>${s.visited}</b><span>Famílias visitadas</span></div><div class="kpi red"><b>${s.pending}</b><span>Sem visita</span></div><div class="kpi blue"><b>${s.geoPct}%</b><span>Cobertura de rota a pé</span></div><div class="kpi amber"><b>${s.nogeo}</b><span>Geo manual/posterior</span></div></div><div class="indicator-grid">${items.map(([n,v,f])=>`<button class="indicator" data-ind="${f}"><b>${v}</b><span>${E(n)}</span></button>`).join('')}</div><div class="card" style="margin-top:13px"><div class="title">Fonte e privacidade</div><div class="notice ok">Dados carregados das APIs do projeto Supabase. As distâncias exibidas já estão pré-calculadas; esta tela não envia endereços de pacientes a mapas externos.</div></div>`;app.querySelectorAll('[data-ind]').forEach(b=>b.onclick=()=>{state.filter=b.dataset.ind;state.page='families';renderNav();renderFamilies()})}
function reportRows(filter){const fn=FILTERS[filter]?.[1]||FILTERS.all[1];return state.families.filter(fn).sort(familyCmp)}
function downloadCsv(rows,name){const escCsv=v=>'"'+String(v??'').replace(/"/g,'""')+'"',out=[['Família','Arrimo','Endereço','Status','Integrantes','Risco','Distância a pé (m)','Tempo a pé (min)','Precisão']].concat(rows.map(x=>[x.code,x.responsible,[x.street,x.number,x.neighborhood].filter(Boolean).join(', '),x.visited?'Visitada':'Sem visita',x.members.length,x.risk,walkM(x)??'',walkMin(x)??'',walkM(x)==null?'Pendente':geoPrecision(x)]));const blob=new Blob([out.map(r=>r.map(escCsv).join(';')).join('\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function renderReports(){const s=stats();app.innerHTML=`<section class="hero"><h1>📄 Relatórios</h1><p>Listas operacionais com cobertura, grupos prioritários e distância a pé.</p></section><div class="card"><div class="title">Cobertura do mês</div><div class="row"><button class="btn teal" data-r="visited">Visitadas (${s.visited})</button><button class="btn red" data-r="pending">Sem visita (${s.pending})</button></div></div><div class="card"><div class="title">Grupos prioritários</div><div class="toolbar"><button class="btn soft" data-r="has">HAS (${s.has})</button><button class="btn soft" data-r="dm">Diabetes (${s.dm})</button><button class="btn soft" data-r="acam">Acamados (${s.acam})</button><button class="btn soft" data-r="a65">65+ (${s.a65})</button><button class="btn soft" data-r="preg">Gestantes (${s.preg})</button></div></div><div class="card"><div class="title">Distância da ESF</div><div class="toolbar"><button class="btn soft" data-r="near">≤500 m (${s.near})</button><button class="btn soft" data-r="mid">500 m–1 km (${s.mid})</button><button class="btn soft" data-r="far">>1 km (${s.far})</button><button class="btn gray" data-r="nogeo">Sem geo (${s.nogeo})</button></div></div><div id="report-list"></div>`;app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>showReport(b.dataset.r));showReport('pending')}
function showReport(f){const rows=reportRows(f),box=document.getElementById('report-list');if(!box)return;box.innerHTML=`<div class="card"><div class="title">${E(FILTERS[f]?.[0]||'Relatório')}</div><div class="row" style="margin-bottom:10px"><button class="btn teal" id="csv-report">Baixar CSV</button><button class="btn soft" id="open-filter">Abrir em Famílias</button></div><div style="overflow:auto"><table class="report-table"><thead><tr><th>Família</th><th>Arrimo</th><th>Status</th><th>Endereço</th><th>A pé</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${E(x.code||'—')}</td><td>${E(T(x.responsible||''))}</td><td>${x.visited?'Visitada':'Sem visita'}</td><td>${E([x.street,x.number].filter(Boolean).join(', ')||'Sem endereço')}</td><td>${walkM(x)==null?'—':E(fmtWalk(walkM(x)))+(walkMin(x)!=null?` · ${walkMin(x)} min`:'')}</td></tr>`).join('')}</tbody></table></div></div>`;document.getElementById('csv-report').onclick=()=>downloadCsv(rows,`esf06-${f}-${today()}.csv`);document.getElementById('open-filter').onclick=()=>{state.filter=f;state.page='families';renderNav();renderFamilies()}}
function renderMore(){const s=stats();app.innerHTML=`<section class="hero"><h1>⚙️ Mais</h1><p>Estado da conexão, cobertura territorial e manutenção da versão de produção.</p></section><div class="card"><div class="title">Conexão</div><div class="notice ok">✅ Supabase conectado · população carregada com <b>no-store</b>.</div><div class="row" style="margin-top:12px"><button class="btn teal" id="refresh-all">↻ Atualizar tudo</button><button class="btn soft" id="copy-link">Copiar link pessoal</button></div></div><div class="card"><div class="title">Geolocalização operacional</div><div class="grid-kpi" style="margin-bottom:0"><div class="kpi blue"><b>${s.geo}</b><span>Famílias com rota a pé</span></div><div class="kpi amber"><b>${s.nogeo}</b><span>Atualização manual/posterior</span></div></div><div class="search-note">As distâncias são de caminhada até a ESF 6 Pontal e permanecem marcadas como estimadas até confirmação por GPS.</div></div><div class="card"><div class="title">Privacidade</div><div class="notice">O site não carrega mapa externo nem envia automaticamente o endereço do domicílio para um provedor de mapas. Ele mostra somente os resultados que já estão armazenados no Supabase.</div></div><div class="card"><div class="title">Produção</div><div class="sub">Arquivo único de interface · sem service worker próprio · sem lista de pacientes embutida · Supabase como fonte de verdade.</div></div>`;document.getElementById('refresh-all').onclick=async()=>{try{await loadPopulation();toast('Dados atualizados do Supabase.');renderMore()}catch(e){toast(e.message,'err')}};document.getElementById('copy-link').onclick=()=>copyText(location.href,'Link')}
const NAV=[['families','👥','Famílias'],['recad','🏘️','Recad.'],['plan','🗓️','Planejar'],['data','▮▮▮','Dados'],['reports','📄','Relat.'],['more','⚙️','Mais']];
function renderNav(){nav.innerHTML=NAV.map(([id,ico,label])=>`<button class="nav-btn ${state.page===id?'on':''}" data-nav="${id}" ${state.page===id?'aria-current="page"':''}><span>${ico}</span><span>${label}</span></button>`).join('');nav.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{state.page=b.dataset.nav;renderNav();renderPage();scrollTo({top:0,behavior:'instant'})})}
async function renderPage(){if(state.page==='families')return renderFamilies();if(state.page==='recad')return renderRecadastro();if(state.page==='plan')return renderPlan();if(state.page==='data')return renderData();if(state.page==='reports')return renderReports();return renderMore()}
async function init(){if(!ACCESS){app.innerHTML='<div class="card"><div class="title">Link pessoal necessário</div><div class="notice warn">Abra esta página com o parâmetro <b>k</b> do seu acesso pessoal.</div></div>';renderNav();return}try{busy();const [pr]=await Promise.all([api('main','profile'),loadPopulation()]);state.profile=pr.profile||null;document.getElementById('profile-name').textContent=T(state.profile?.full_name||'ESF06');document.getElementById('hello').textContent=greeting()+' · Supabase conectado · '+stats().geoPct+'% com rota a pé';renderNav();await renderPage()}catch(e){app.innerHTML=`<div class="card"><div class="title">Falha ao abrir</div><div class="notice warn">${E(e.message)}</div></div>`;toast(e.message,'err')}finally{busy(false)}}
init();
})();
</script>
