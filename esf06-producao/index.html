<script>
(async()=>{
  try{
    const r=await fetch('./base-v20260831.html?rev=20260904-0925-r6',{cache:'no-store'});
    if(!r.ok)throw new Error('Falha ao carregar a interface');
    let h=await r.text();

    const css=`
<style id="esf06-r6-field-tools">
.family-top{align-items:flex-start!important}
.status{align-self:flex-start!important;flex:0 0 auto!important;height:auto!important;min-height:0!important;max-height:none!important;width:auto!important;min-width:0!important}
.family-card-actions,.rec-card-actions{display:flex!important;flex-direction:column!important;align-items:flex-end!important;justify-content:flex-start!important;gap:8px!important;flex:0 0 auto!important}
.quick-recad,.rec-start{width:50px!important;height:50px!important;min-width:50px!important;min-height:50px!important;max-width:50px!important;max-height:50px!important;padding:0!important;border:0!important;border-radius:50%!important;background:#079b88!important;color:#fff!important;display:grid!important;place-items:center!important;font-size:24px!important;line-height:1!important;box-shadow:0 5px 14px rgba(7,155,136,.24)!important;cursor:pointer!important}
.quick-recad:active,.rec-start:active{transform:scale(.96)}
.quick-recad:focus-visible,.rec-start:focus-visible{outline:3px solid #8bb4ff!important;outline-offset:2px!important}
.geo-action{display:block!important;width:100%!important;text-align:left!important;cursor:pointer!important;font:inherit!important;min-height:0!important}
.geo-action:active{transform:scale(.995)}
.geo-action .geo-tap{display:inline-block;margin-top:8px;padding:5px 8px;border-radius:999px;background:#f3e5a7;color:#705600;font-size:11px;font-weight:900}
.gps-back{position:fixed;inset:0;z-index:500;background:rgba(7,26,49,.78);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.gps-modal{width:min(100%,620px);max-height:92vh;overflow:auto;background:#fff;border-radius:25px;padding:18px;box-shadow:0 20px 60px #0016}
.gps-modal h2{margin:0;font-size:22px}.gps-modal p{color:#708096;line-height:1.45}.gps-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:13px 0}.gps-kpi{border:1px solid #dfe6ed;border-radius:16px;padding:12px;background:#f8fafc}.gps-kpi b{display:block;font-size:22px}.gps-kpi span{font-size:11px;color:#708096}.gps-state{padding:12px;border-radius:14px;background:#eef5ff;color:#365d8c;font-weight:800;line-height:1.4}.gps-state.good{background:#eaf9f2;color:#216c4e}.gps-state.warn{background:#fff7df;color:#7d631f}.gps-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.gps-actions button{border:0;border-radius:13px;padding:12px;font-weight:900;min-height:48px}.gps-confirm{background:#079b88;color:#fff}.gps-map{background:#246bfd;color:#fff}.gps-retry{background:#eef2f6;color:#526176}.gps-close{background:#fff0f0;color:#a52f35}.gps-actions button:disabled{opacity:.42}
.rec-member{transition:.15s}.rec-member.rec-leaving{border-color:#e8b4b7;background:#fff7f7}.rec-member-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.rec-leave-box{margin-top:10px;padding:10px;border-radius:13px;background:#fff0f0}.rec-leave-box label{margin-top:6px}.rec-new-arrimo{margin-top:10px}.rec-former{margin-top:12px;border:1px dashed #cad4df;border-radius:14px;padding:10px}.rec-former summary{font-weight:900;color:#526176;cursor:pointer}.rec-former .btn{margin-top:9px}.rec-member .btn.red{background:#ffe5e5;color:#a43137}
@media(min-width:720px){.gps-back{align-items:center}}
@media(max-width:520px){.family-top{align-items:flex-start!important}.status{white-space:nowrap!important;text-align:center!important}.gps-actions{grid-template-columns:1fr}.rec-member-actions{grid-template-columns:1fr}}
</style>`;
    h=h.replace('</head>',css+'</head>');
    h=h.replace('PRODUÇÃO · GEO','PRODUÇÃO · GEO · R7');

    const familyStatus='<span class="status ${x.visited?\'ok\':\'due\'}">${x.visited?\'✓ Visitada no mês\':\'● Sem visita no mês\'}</span>';
    const familyActions='<div class="family-card-actions"><span class="status ${x.visited?\'ok\':\'due\'}">${x.visited?\'✓ Visitada no mês\':\'● Sem visita no mês\'}</span><button type="button" class="quick-recad" data-quick-recad="${E(x.id)}" aria-label="Iniciar recadastramento de ${E(T(x.responsible||x.arrimo?.full_name||\'família\'))}" title="Iniciar recadastramento">📝</button></div>';
    if(!h.includes(familyStatus))throw new Error('Card de família não localizado');
    h=h.replace(familyStatus,familyActions);

    const familyHandlers="app.querySelectorAll('[data-family]').forEach(b=>{b.onclick=()=>openFamily(b.dataset.family);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openFamily(b.dataset.family)}}});applyFamilySearch()";
    const familyHandlersR6="app.querySelectorAll('[data-family]').forEach(b=>{b.onclick=()=>openFamily(b.dataset.family);b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openFamily(b.dataset.family)}}});app.querySelectorAll('[data-quick-recad]').forEach(b=>b.onclick=async e=>{e.stopPropagation();try{const x=state.families.find(z=>z.id===b.dataset.quickRecad);if(!x)throw new Error('Família não localizada');state.page='recad';renderNav();await renderRecadastro();state.recadStreet={street:x.street||''};await openRecFamily(x.id)}catch(err){toast(err.message||'Falha ao abrir recadastramento','err')}});applyFamilySearch()";
    if(!h.includes(familyHandlers))throw new Error('Eventos dos cards não localizados');
    h=h.replace(familyHandlers,familyHandlersR6);

    const recMarker='${recStatusBadge(x.visit_status)}</div><div class="family-foot">';
    const recReplacement='<div class="rec-card-actions">${recStatusBadge(x.visit_status)}<button type="button" class="rec-start" data-open-rec-family="${E(x.id)}" aria-label="Iniciar recadastramento de ${E(T(x.responsible_name||\'família\'))}" title="Iniciar recadastramento">📝</button></div></div><div class="family-foot">';
    if(h.includes(recMarker))h=h.replace(recMarker,recReplacement);

    const geoPanelR6=[
      "function geoPanel(x){",
      " const m=walkM(x),min=walkMin(x);",
      " if(m==null){const fid=E(x&&x.id?x.id:'');const gps=!!(x&&x.geo_verified);return '<button type=\"button\" class=\"geo-panel pending geo-action\" data-geo-capture-id=\"'+fid+'\"><div class=\"big\">'+(gps?'✅ GPS confirmado':'📍 Sem geolocalização')+'</div><div class=\"sub\">'+(gps?'O ponto da casa já foi confirmado. Toque para recalcular a rota a pé até a ESF 6 Pontal.':'Toque aqui estando na casa. O celular usará GPS de alta precisão, bússola e rota a pé até a ESF 6 Pontal.')+'</div><span class=\"geo-tap\">'+(gps?'Recalcular GPS/rota':'Usar minha localização agora')+'</span></button>';}",
      " return '<div class=\"geo-panel\"><div class=\"big\">🚶 '+E(fmtWalk(m))+(min!=null?' · ~'+min+' min':'')+'</div><div class=\"sub\">Distância caminhando até a ESF 6 Pontal · '+E(geoPrecision(x))+(x&&x.geo_verified?' · confirmado':' · estimativa territorial')+'</div></div>';",
      "}"
    ].join('\n');
    const geoRegex=/function geoPanel\(x\)\{[\s\S]*?\}\nfunction toast/;
    if(!geoRegex.test(h))throw new Error('Painel de geolocalização não localizado');
    h=h.replace(geoRegex,geoPanelR6+'\nfunction toast');

    const recModalMarker='<button class="close" data-close aria-label="Fechar">×</button><h2>${E(T(f.responsible_name||\'Família\'))}</h2>';
    const recModalReplacement='<button class="close" data-close aria-label="Fechar">×</button><span data-recad-family-id="${E(id)}" hidden></span><h2>${E(T(f.responsible_name||\'Família\'))}</h2>';
    if(!h.includes(recModalMarker))throw new Error('Modal do recadastramento não localizado');
    h=h.replace(recModalMarker,recModalReplacement);

    const familyModalMarker='<button class="close" data-close aria-label="Fechar">×</button><h2>${E(T(x.responsible||\'Família\'))}</h2>';
    const familyModalReplacement='<button class="close" data-close aria-label="Fechar">×</button><span data-family-record-id="${E(id)}" hidden></span><h2>${E(T(x.responsible||\'Família\'))}</h2>';
    if(!h.includes(familyModalMarker))throw new Error('Ficha da família não localizada');
    h=h.replace(familyModalMarker,familyModalReplacement);

    const personModalMarker='<button class="close" data-close aria-label="Fechar">×</button><h2>${E(T(p.full_name))}</h2>';
    const personModalReplacement='<button class="close" data-close aria-label="Fechar">×</button><span data-person-record-id="${E(id)}" hidden></span><h2>${E(T(p.full_name))}</h2>';
    if(!h.includes(personModalMarker))throw new Error('Ficha da pessoa não localizada');
    h=h.replace(personModalMarker,personModalReplacement);

    const runtimes='<script src="./audit-edit-r6.js?rev=20260904-0925-r6"><\/script><script src="./recad-members-r5.js?rev=20260904-0925-r6"><\/script><script src="./recad-comodos-r7.js?rev=20260904-1013-r7"><\/script><script src="./geo-r4.js?rev=20260904-0925-r6"><\/script>';
    h=h.replace('</body>',runtimes+'</body>');

    document.open();
    document.write(h);
    document.close();
  }catch(e){
    const box=document.querySelector('.box');
    if(box)box.innerHTML='<strong>Não foi possível abrir o Gestão R7.</strong><p style="color:#708096">Atualize a página para tentar novamente.</p><button onclick="location.reload()" style="border:0;border-radius:12px;padding:12px 16px;background:#079b88;color:#fff;font-weight:800">Atualizar</button>';
    console.error(e);
  }
})();
</script>
