(async()=>{
 try{

   if(h.includes(hook))h=h.replace(hook,hook2);

 }catch(e){document.body.innerHTML='<div class="boot"><div class="box"><strong>Não foi possível abrir a versão R8.</strong><p style="color:#708096">Tente atualizar a página.</p><button onclick="location.reload()" style="border:0;border-radius:12px;padding:12px 16px;background:#079b88;color:#fff;font-weight:800">Atualizar</button></div></div>';console.error(e)}
})();
